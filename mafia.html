<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мафия — Крокодил Арек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.rolecard{border-radius:22px;padding:16px 18px;margin:12px 0;color:#fff;box-shadow:var(--shadow);text-align:center;animation:pop .5s both}
.rolecard small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.rolecard b{display:block;font-size:30px;font-family:var(--font-display);margin:4px 0}
.rolecard span{display:block;font-size:13px;opacity:.9;line-height:1.35}
.rolecard .mates{margin-top:10px;background:rgba(255,255,255,.18);border-radius:12px;padding:8px 10px;font-weight:700}
.role-mafia{background:linear-gradient(135deg,#7a1d1d,#3b0d0d)}
.role-doctor{background:linear-gradient(135deg,#1F8A5B,#0E5C3B)}
.role-sheriff{background:linear-gradient(135deg,#C9851A,#7A4C08)}
.role-civil{background:linear-gradient(135deg,#2B6CB0,#1B4474)}
.set-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.set-row button{flex:1;min-width:64px;border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:10px;font-weight:800;font-family:var(--font-display);cursor:pointer}
.set-row button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.set-row button:disabled{opacity:.5;cursor:default}
.rep{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;margin:6px 0;font-size:14px;line-height:1.4}
#mafNight{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 0,#1a2150,#070b1a 70%);color:#dfe6ff;overflow-y:auto;padding:28px 18px 110px;text-align:center}
#mafNight .in{max-width:520px;margin:0 auto}
.n-moon{font-size:64px;animation:pop .6s both}
#mafNight h1{color:#fff;font-size:40px;letter-spacing:.1em;text-transform:uppercase;margin:4px 0}
.n-cd{font-size:15px;opacity:.85;margin:4px 0 14px}.n-cd b{font-size:22px;font-family:var(--font-display)}
.n-msg{background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);border-radius:16px;padding:14px;margin:14px 0;font-weight:700;font-size:16px;line-height:1.4}
.n-note{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;font-size:13px;margin:8px 0}
.n-sleep{margin-top:30px;font-size:18px;opacity:.8}
.n-title{font-weight:800;margin:16px 0 8px;font-size:16px}
.npick{display:block;width:100%;margin:0 0 8px;padding:13px;border-radius:14px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:var(--font-display)}
.npick.mine{border-color:#4fe3a0;background:rgba(79,227,160,.2)}
.npick.mark{color:#ff6b6b;border-color:#ff6b6b;background:rgba(255,80,80,.18)}
.npick.mine.mark{border-color:#4fe3a0}
.npick:disabled{opacity:.4;cursor:default}
#nLast textarea{width:100%;min-height:90px;border-radius:14px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;padding:10px;font-size:15px;font-family:inherit;resize:none;margin:8px 0}
#nLast .btn{margin-top:0}
</style>
</head>
<body>
<div class="strip"></div>
<div id="mafNight" class="hidden"><div class="in">
  <div id="nMain"></div>
  <div id="nLast" class="hidden">
    <div class="n-title">☠ Тебя убили. Напиши последние слова — все увидят их утром:</div>
    <textarea id="lwText" maxlength="200" placeholder="Последние слова…"></textarea>
    <button class="btn btn-orange" data-a="sendLast">Отправить</button>
  </div>
</div></div>

<script type="module">
import { $, esc, P, db, doc, runTransaction, updateDoc, toast, errMsg, shuffle, initial, avStyle, nameHtml, confetti } from './shared.js';
import { R, initGame, playersSorted, setPlayingUI, openTurnOv } from './room.js';

const MIN = 4, MAX = 15;
const DAY1 = 30000, DAYN = 120000, VOTE = 8000, NIGHT_ACT = 7000, NIGHT_LEN = 20000, WIN_COINS = 5;
const ROLE = {
  mafia: { n: 'Мафия', ic: '🔪', d: 'Ночью вместе с напарниками выбирай жертву. Цель — убрать мирных.' },
  doctor: { n: 'Доктор', ic: '💉', d: 'Каждую ночь лечишь одного игрока. Себя — только через ночь.' },
  sheriff: { n: 'Шериф', ic: '⭐', d: 'Каждую ночь проверяешь роль любого игрока.' },
  civil: { n: 'Мирный житель', ic: '🙂', d: 'Днём ищи мафию и голосуй, кого исключить.' }
};
const mafiaOpts = (n) => n <= 5 ? [1] : n <= 7 ? [1, 2] : [1, 2, 3];     // 4–5: нет выбора · 6–7: 1–2 · 8+: 1–3
const mafiaCnt = (r, n) => Math.min(r.mafiaCount || 1, Math.max(...mafiaOpts(n)));
const doctorOn = (r, n) => n >= 4 && r.doctor !== false;
const teamOf = (role) => role === 'mafia' ? 'mafia' : 'town';
const aliveIds = (d) => d.order.filter(id => d.players[id].alive);
let splashKey = null, claiming = false, tryKey = null, tryAt = 0;

/* ===== Старт игры: раздача ролей ===== */
async function startMafia() {
  try {
    await runTransaction(db, async (tx) => {
      const ref = R.ref(), d = (await tx.get(ref)).data();
      if (d.status !== 'lobby') return;
      const list = playersSorted(d), n = list.length;
      if (n < MIN) throw new Error('Нужно минимум 4 игрока');
      if (n > MAX) throw new Error('Максимум 15 игроков');
      const mc = mafiaCnt(d, n), roles = ['sheriff', ...Array(mc).fill('mafia')];
      if (doctorOn(d, n)) roles.push('doctor');
      while (roles.length < n) roles.push('civil');
      shuffle(roles);
      const ids = list.map(p => p.id), now = Date.now();
      const upd = {
        status: 'playing', phase: 'day', ph: 1, day: 1, night: 0, phaseEnd: now + DAY1, startedAt: now, order: ids,
        act: { m: {}, h: null, s: null }, docSelf: null, nres: null, lastWords: null, report: [], voteNote: '', votes: {},
        winner: null, paid: {}, lastEvent: 'Игра началась! Идёт обсуждение — скоро наступит ночь.'
      };
      ids.forEach((id, i) => { upd['players.' + id + '.role'] = roles[i]; upd['players.' + id + '.alive'] = true; upd['players.' + id + '.revealed'] = false; upd['players.' + id + '.checks'] = []; });
      tx.update(ref, upd);
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}

/* ===== Ход времени: фазы переключаются по таймеру (любой клиент, транзакция защищает от дублей) ===== */
function winnerOf(d, deadSet) {
  const a = d.order.filter(id => d.players[id].alive && !deadSet.has(id));
  const m = a.filter(id => d.players[id].role === 'mafia').length, o = a.length - m;
  return m === 0 ? 'town' : (m >= o ? 'mafia' : null);
}
const nightStart = (d, now) => ({ phase: 'night_act', phaseEnd: now + NIGHT_ACT, nightStart: now, night: (d.night || 0) + 1, act: { m: {}, h: null, s: null }, nres: null, lastWords: null });

function step(d) {
  const now = Date.now(), pl = d.players, upd = { ph: d.ph + 1 };
  if (d.phase === 'day') {
    if (d.day === 1) return { ...upd, ...nightStart(d, now), lastEvent: '🌙 Наступила ночь…' };
    return { ...upd, phase: 'vote', phaseEnd: now + VOTE, votes: {}, lastEvent: '🗳 Голосование! Кого исключить?' };
  }
  if (d.phase === 'vote') {
    const alive = aliveIds(d), cnt = {};
    alive.forEach(id => { const v = (d.votes || {})[id]; const t = (v && v !== 'skip' && pl[v] && pl[v].alive) ? v : 'skip'; cnt[t] = (cnt[t] || 0) + 1; });
    const max = Math.max(...Object.values(cnt)), top = Object.keys(cnt).filter(k => cnt[k] === max);
    let note, dead = new Set();
    if (top.length === 1 && top[0] !== 'skip') {
      const k = top[0]; dead.add(k);
      upd['players.' + k + '.alive'] = false; upd['players.' + k + '.revealed'] = true;
      note = `🗳 Исключён(а) ${pl[k].name} — ${ROLE[pl[k].role].ic} ${ROLE[pl[k].role].n}`;
    } else note = top.length > 1 ? '🤝 Голоса разделились поровну — никто не исключён' : '🤷 Большинство воздержалось — никто не исключён';
    const w = winnerOf(d, dead);
    if (w) return { ...upd, status: 'finished', phase: null, winner: w, voteNote: note, lastEvent: note };
    return { ...upd, ...nightStart(d, now), voteNote: note, lastEvent: '🌙 Наступила ночь…' };
  }
  if (d.phase === 'night_act') {
    const alive = aliveIds(d), act = d.act || {};
    const maf = alive.filter(id => pl[id].role === 'mafia');
    const ch = maf.map(id => (act.m || {})[id]);
    // убийство только если ВСЕ живые мафиози выбрали одного и того же игрока
    const target = (maf.length && ch.every(c => c && c !== 'skip' && c === ch[0] && pl[c] && pl[c].alive)) ? ch[0] : null;
    const doc = alive.find(id => pl[id].role === 'doctor'), sh = alive.find(id => pl[id].role === 'sheriff');
    const heal = doc && act.h && pl[act.h] && pl[act.h].alive ? act.h : null;
    const nres = { msg: 'Этой ночью никто не погиб.', victim: null, saved: false };
    if (target && heal === target) { nres.saved = true; nres.msg = 'Мафия стреляла, но доктор вылечил одного из игроков.'; }
    else if (target) {
      nres.victim = target; upd['players.' + target + '.alive'] = false;
      nres.msg = pl[target].role === 'mafia' ? 'Мафия убила одного из своих…' : 'Мафия убила мирного, последние слова утром..';
    }
    if (doc && heal === doc) upd.docSelf = d.night;
    if (sh && act.s && pl[act.s]) {
      nres.chk = { by: sh, id: act.s, name: pl[act.s].name, role: pl[act.s].role };
      upd['players.' + sh + '.checks'] = [...(pl[sh].checks || []), { id: act.s, name: pl[act.s].name, role: pl[act.s].role, night: d.night }];
    }
    return { ...upd, phase: 'night_end', phaseEnd: Math.max((d.nightStart || now) + NIGHT_LEN, now + 4000), nres };
  }
  if (d.phase === 'night_end') {
    const nr = d.nres || {}, report = [];
    if (nr.victim) {
      const v = pl[nr.victim].name, lw = d.lastWords && d.lastWords.text;
      report.push(`☠️ Этой ночью убит(а) ${v}.`);
      report.push(lw ? `💬 Последние слова ${v}: «${lw}»` : `🤐 ${v} не успел(а) ничего сказать.`);
    } else if (nr.saved) report.push('💉 Мафия стреляла, но доктор вылечил одного из игроков.');
    else report.push('🌅 Этой ночью никто не погиб.');
    const w = winnerOf(d, new Set());
    if (w) return { ...upd, status: 'finished', phase: null, winner: w, report, voteNote: '', lastEvent: report[0] };
    return { ...upd, phase: 'day', day: d.day + 1, phaseEnd: now + DAYN, report, voteNote: '', lastEvent: '☀️ Наступило утро. Обсуждение — 2 минуты.' };
  }
  return null;
}
async function advance(ph) {
  await runTransaction(db, async (tx) => {
    const ref = R.ref(), d = (await tx.get(ref)).data();
    if (!d || d.status !== 'playing' || d.ph !== ph || Date.now() < d.phaseEnd - 500) return;
    const u = step(d); if (u) tx.update(ref, u);
  });
}
function tick() {
  const r = R.room; if (!r || r.status !== 'playing') return;
  const left = r.phaseEnd - Date.now(), sec = Math.max(0, Math.ceil(left / 1000));
  document.querySelectorAll('[data-cd]').forEach(el => { el.textContent = sec; });
  if (left > 0) return;
  const wait = r.hostId === P.user.uid ? 0 : 2500 + (P.user.uid.charCodeAt(0) % 5) * 500;   // если ведущий вышел — переключит кто-то другой
  if (-left < wait) return;
  if (tryKey === r.ph && Date.now() - tryAt < 3000) return;
  tryKey = r.ph; tryAt = Date.now();
  advance(r.ph).catch(() => {});
}
setInterval(tick, 250);

/* ===== Действия игроков ===== */
async function vote(el) {
  const t = el.dataset.id, me = P.user.uid;
  try {
    await runTransaction(db, async (tx) => {
      const ref = R.ref(), d = (await tx.get(ref)).data();
      if (d.status !== 'playing' || d.phase !== 'vote' || !d.players[me].alive) return;
      if (t !== 'skip' && (!d.players[t] || !d.players[t].alive || t === me)) return;
      tx.update(ref, { ['votes.' + me]: t });
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}
async function nPick(el) {
  const kind = el.dataset.k, t = el.dataset.id, me = P.user.uid;
  try {
    await runTransaction(db, async (tx) => {
      const ref = R.ref(), d = (await tx.get(ref)).data(), my = d.players[me];
      if (d.status !== 'playing' || d.phase !== 'night_act' || !my.alive || Date.now() > d.phaseEnd + 1500) return;
      const ok = t !== 'skip' && d.players[t] && d.players[t].alive;
      if (kind === 'm') {
        if (my.role !== 'mafia' || (t !== 'skip' && (!ok || t === me))) return;
        tx.update(ref, { ['act.m.' + me]: t });
      } else if (kind === 's') {
        if (my.role !== 'sheriff' || !ok || t === me) return;
        tx.update(ref, { 'act.s': t });
      } else if (kind === 'h') {
        if (my.role !== 'doctor' || !ok) return;
        if (t === me && d.docSelf != null && d.docSelf === d.night - 1) throw new Error('Себя можно лечить только через ночь');
        tx.update(ref, { 'act.h': t });
      }
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}
async function sendLast() {
  const text = $('lwText').value.trim().slice(0, 200), me = P.user.uid;
  if (!text) return toast('Напиши последние слова', 'error');
  try {
    await runTransaction(db, async (tx) => {
      const ref = R.ref(), d = (await tx.get(ref)).data();
      if (d.phase !== 'night_end' || !d.nres || d.nres.victim !== me || d.lastWords) return;
      tx.update(ref, { lastWords: { id: me, text } });
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}
async function setMafia(el) { try { await updateDoc(R.ref(), { mafiaCount: +el.dataset.n }); } catch (e) { toast('Не удалось сохранить', 'error'); } }
async function setDoctor(el) { try { await updateDoc(R.ref(), { doctor: el.dataset.v === '1' }); } catch (e) { toast('Не удалось сохранить', 'error'); } }

async function claimCoins() {
  if (claiming) return; claiming = true;
  const me = P.user.uid;
  try {
    let got = false;
    await runTransaction(db, async (tx) => {
      const ref = R.ref(), uref = doc(db, 'users', me);
      const d = (await tx.get(ref)).data(), us = await tx.get(uref);
      if (d.status !== 'finished' || !d.winner || (d.paid || {})[me] || teamOf(d.players[me].role) !== d.winner) return;
      tx.update(uref, { coins: ((us.data() || {}).coins || 0) + WIN_COINS });
      tx.update(ref, { ['paid.' + me]: true }); got = true;
    });
    if (got) { toast(`🏆 Победа! +${WIN_COINS} монет`, 'success'); confetti(); }
  } catch (e) { claiming = false; }
}

/* ===== Отрисовка ===== */
const roleChip = (role) => `<span class="chip"><b>${ROLE[role].ic} ${ROLE[role].n}</b></span>`;
function pRow(p, r, viewer) {
  const fin = r.status === 'finished', isMaf = viewer.role === 'mafia';
  const showRole = fin || p.revealed || p.id === P.user.uid || (isMaf && p.role === 'mafia');
  const badges = [r.hostId === p.id ? '<span class="badge">👑</span>' : '',
    p.alive ? '' : '<span class="badge place" style="background:var(--danger-bg);color:#B33636">☠ выбыл</span>'].join('');
  return `<div class="player ${p.alive ? '' : 'out'}"><div class="avatar" style="${avStyle(p.name)}">${esc(initial(p.name))}</div>
    <div class="info"><div class="name">${nameHtml(p)}${p.id === P.user.uid ? ' <span class="muted" style="font-weight:500">(ты)</span>' : ''} ${badges}</div>${showRole ? roleChip(p.role) : ''}</div></div>`;
}
function roleCard(r, me) {
  const ro = ROLE[me.role];
  const mates = me.role === 'mafia' ? r.order.filter(id => id !== P.user.uid && r.players[id].role === 'mafia').map(id => esc(r.players[id].name) + (r.players[id].alive ? '' : ' ☠')) : null;
  return `<div class="rolecard role-${me.role}"><small>Твоя роль${me.alive ? '' : ' · ты выбыл(а)'}</small><b>${ro.ic} ${ro.n}</b><span>${ro.d}</span>
    ${mates ? `<div class="mates">🔪 Мафия: ${mates.length ? mates.join(', ') : 'ты один'}</div>` : ''}</div>`;
}
function pickList(r, kind) {
  const me = P.user.uid, act = r.act || {}, cur = kind === 'm' ? (act.m || {})[me] : act[kind];
  const marks = new Set();
  if (kind === 'm') r.order.forEach(id => { const p = r.players[id]; if (id !== me && p.alive && p.role === 'mafia') { const v = (act.m || {})[id]; if (v && v !== 'skip') marks.add(v); } });
  const items = aliveIds(r).filter(id => kind === 'h' || id !== me);
  let h = items.map(id => {
    const dis = kind === 'h' && id === me && r.docSelf != null && r.docSelf === r.night - 1;
    return `<button class="npick ${cur === id ? 'mine' : ''} ${marks.has(id) ? 'mark' : ''}" data-a="nPick" data-k="${kind}" data-id="${id}" ${dis ? 'disabled' : ''}>${esc(r.players[id].name)}${id === me ? ' (ты)' : ''}${marks.has(id) ? ' 🎯' : ''}${dis ? ' · нельзя 2 ночи подряд' : ''}</button>`;
  }).join('');
  if (kind === 'm') h += `<button class="npick ${cur === 'skip' ? 'mine' : ''}" data-a="nPick" data-k="m" data-id="skip">🕊 Воздержаться от убийства</button>`;
  return h;
}
function renderNight(r, me) {
  const ov = $('mafNight'), on = r.status === 'playing' && (r.phase === 'night_act' || r.phase === 'night_end');
  ov.classList.toggle('hidden', !on);
  if (!on) { $('nLast').classList.add('hidden'); $('lwText').value = ''; return; }
  const sec = Math.max(0, Math.ceil((r.phaseEnd - Date.now()) / 1000));
  let h = `<div class="n-moon">🌙</div><h1>Ночь</h1><div class="n-cd">${r.phase === 'night_act' ? 'Время на выбор' : 'До утра'}: <b data-cd>${sec}</b> с</div>`;
  if (r.voteNote) h += `<div class="n-note">${esc(r.voteNote)}</div>`;
  if (r.phase === 'night_act') {
    if (!me.alive) h += '<p class="n-sleep">☠ Ты выбыл(а) и наблюдаешь за ночью</p>';
    else if (me.role === 'mafia') h += `<div class="n-title">🔪 Кого убить? (убийство — только если вся мафия выберет одного)</div>${pickList(r, 'm')}`;
    else if (me.role === 'sheriff') h += `<div class="n-title">⭐ Кого проверить?</div>${pickList(r, 's')}`;
    else if (me.role === 'doctor') h += `<div class="n-title">💉 Кого лечить?</div>${pickList(r, 'h')}`;
    else h += '<p class="n-sleep">😴 Город спит… Ждём утра</p>';
  } else {
    const nr = r.nres || {};
    h += `<div class="n-msg">${esc(nr.msg || '')}</div>`;
    if (me.role === 'sheriff' && nr.chk && nr.chk.by === P.user.uid) h += `<div class="n-msg">🔎 Проверка: ${esc(nr.chk.name)} — ${ROLE[nr.chk.role].ic} ${ROLE[nr.chk.role].n}</div>`;
    if (nr.victim === P.user.uid && r.lastWords) h += '<div class="n-msg">✔ Последние слова отправлены — их увидят утром</div>';
  }
  $('nMain').innerHTML = h;
  const showLast = r.phase === 'night_end' && r.nres && r.nres.victim === P.user.uid && !r.lastWords;
  $('nLast').classList.toggle('hidden', !showLast);
}
function maybeSplash(r, me) {
  if (r.status !== 'playing' || !r.startedAt || splashKey === r.startedAt) return;
  splashKey = r.startedAt;
  if (Date.now() - r.startedAt > 15000) return;
  const ro = ROLE[me.role];
  const mates = me.role === 'mafia' ? r.order.filter(id => id !== P.user.uid && r.players[id].role === 'mafia').map(id => esc(r.players[id].name)) : null;
  openTurnOv(`<div class="tc-label">Твоя роль</div><div class="tc-avatar">${ro.ic}</div><div class="tc-name">${ro.n}</div>
    <div class="tc-word secret"><small>${mates ? 'Твои напарники' : 'Только ты это видишь'}</small><b>${mates ? (mates.join(', ') || 'ты один') : esc(ro.d)}</b></div>`, 5000, true);
}

function renderMafia(r, list, me, isHost) {
  setPlayingUI(r.status !== 'lobby');
  const ev = r.lastEvent ? `<div class="event">${esc(r.lastEvent)}</div>` : '';

  if (r.status === 'lobby') {
    renderNight({ status: 'lobby' }, me);
    const n = list.length, opts = mafiaOpts(n), mc = mafiaCnt(r, n), doc = doctorOn(r, n);
    const mafSet = opts.length === 1
      ? `<p class="muted" style="font-size:14px">Мафия: <b>1</b> (при 4–5 игроках выбора нет)</p>`
      : `<div class="set-row">${opts.map(o => `<button class="${mc === o ? 'on' : ''}" ${isHost ? `data-a="setMafia" data-n="${o}"` : 'disabled'}>${o}</button>`).join('')}</div>`;
    const docSet = n < 4 ? '<p class="muted" style="font-size:14px">Доктор появится от 4 игроков</p>'
      : `<div class="set-row"><button class="${doc ? 'on' : ''}" ${isHost ? 'data-a="setDoctor" data-v="1"' : 'disabled'}>С доктором</button><button class="${doc ? '' : 'on'}" ${isHost ? 'data-a="setDoctor" data-v="0"' : 'disabled'}>Без доктора</button></div>`;
    $('roomBody').innerHTML = `<div class="card pop"><h2>🕵️ Мафия</h2>
      <p class="muted" style="font-size:14px;line-height:1.45">Роли выдаются тайно: мафия, шериф, доктор (по желанию) и мирные. Днём обсуждайте и голосуйте, ночью мафия убивает. От 4 до 15 игроков.</p>
      <label>Количество мафии</label>${mafSet}<label>Доктор</label>${docSet}
      ${isHost ? '' : '<p class="muted" style="font-size:12px">Настройки выбирает ведущий</p>'}</div>
      <h3 style="margin:6px 0 10px">Игроки</h3>${list.map(p => `<div class="player"><div class="avatar" style="${avStyle(p.name)}">${esc(initial(p.name))}</div><div class="info"><div class="name">${nameHtml(p)}${p.id === P.user.uid ? ' <span class="muted" style="font-weight:500">(ты)</span>' : ''} ${r.hostId === p.id ? '<span class="badge">👑 ведущий</span>' : ''}</div></div></div>`).join('')}
      <p class="muted" style="font-size:13px;text-align:center;margin:10px 0">Отправь друзьям код <b>${esc(r.code)}</b></p>
      ${isHost ? `<button class="btn" data-a="start" ${n < MIN ? 'disabled' : ''}>${n < MIN ? 'Нужно минимум 4 игрока' : '▶ Начать игру'}</button><button class="btn btn-soft-red" data-a="closeRoom">Закрыть комнату</button>` : '<p class="muted" style="text-align:center;margin:14px 0">Ждём, пока ведущий начнёт игру…</p>'}
      <button class="btn btn-soft" data-a="leave">Выйти из комнаты</button>`;
    return;
  }

  // игра идёт или окончена
  const sorted = list.slice().sort((a, b) => r.order.indexOf(a.id) - r.order.indexOf(b.id));
  const viewer = r.players[P.user.uid];
  $('playersList').innerHTML = sorted.map(p => pRow(p, r, viewer)).join('');
  maybeSplash(r, viewer);
  renderNight(r, viewer);

  if (r.status === 'finished') {
    const w = r.winner, won = w && teamOf(viewer.role) === w;
    if (w) { if (won) claimCoins(); if (won && !claiming) confetti(); }
    $('roomBody').innerHTML = `${ev}<h2 style="margin:10px 0">🏁 Итоги</h2>
      <div class="rolecard ${w === 'mafia' ? 'role-mafia' : 'role-civil'}"><b>${w === 'mafia' ? '🔪 Победила мафия' : w === 'town' ? '🏙 Победили мирные' : 'Игра завершена'}</b>${w ? `<span>${won ? `Ты в победившей команде: +${WIN_COINS} 🪙` : 'Твоя команда проиграла'}</span>` : ''}</div>
      ${(r.report || []).map(x => `<div class="rep">${esc(x)}</div>`).join('')}
      <h3 class="sec">Все роли</h3>${sorted.map(p => pRow(p, r, viewer)).join('')}
      ${isHost ? '<button class="btn btn-orange" data-a="toLobby">🔄 Играть снова</button><button class="btn btn-soft-red" data-a="closeRoom">Закрыть комнату</button>' : '<p class="muted" style="text-align:center;margin:14px 0">Ведущий может запустить новую игру</p>'}
      <button class="btn btn-soft" data-a="leave">Выйти в меню</button>`;
    return;
  }

  const alive = sorted.filter(p => p.alive), sec = Math.max(0, Math.ceil((r.phaseEnd - Date.now()) / 1000));
  let phase = '';
  if (r.phase === 'day') {
    phase = `<div class="phase">☀️ День ${r.day} · обсуждение · осталось <b data-cd>${sec}</b> с<br><span class="muted" style="font-size:12px">${viewer.alive ? 'Открой чат 💬 и обсуди, кто мафия' : 'Ты выбыл(а) — наблюдаешь'}${r.day === 1 ? ' · в первый день голосования нет' : ''}</span></div>`;
  } else if (r.phase === 'vote') {
    const votes = r.votes || {}, mine = votes[P.user.uid], done = Object.keys(votes).length;
    phase = `<div class="phase vote">🗳 Голосование · осталось <b data-cd>${sec}</b> с<br><span class="muted" style="font-size:12px">Проголосовали: ${done}/${alive.length}${viewer.alive ? ' · кто не проголосует — считается воздержавшимся' : ''}</span></div>` +
      (viewer.alive ? `<div class="player ${mine === 'skip' ? 'voted' : ''}" data-a="vote" data-id="skip"><div class="avatar" style="background:#CBDACD">🕊</div><div class="info"><div class="name">Воздержаться ${mine === 'skip' ? '<span class="badge turn">твой голос</span>' : ''}</div></div></div>` +
        alive.filter(p => p.id !== P.user.uid).map(p => `<div class="player ${mine === p.id ? 'voted' : ''}" data-a="vote" data-id="${p.id}"><div class="avatar" style="${avStyle(p.name)}">${esc(initial(p.name))}</div><div class="info"><div class="name">${esc(p.name)} ${mine === p.id ? '<span class="badge turn">твой голос</span>' : ''}</div></div></div>`).join('') : '');
  }
  const sheriffLog = viewer.role === 'sheriff' && (viewer.checks || []).length
    ? `<h3 class="sec">🔎 Твои проверки</h3>${viewer.checks.map(c => `<div class="rep">${esc(c.name)} — ${ROLE[c.role].ic} ${ROLE[c.role].n}</div>`).join('')}` : '';
  $('roomBody').innerHTML = `${ev}${roleCard(r, viewer)}${phase}
    ${r.phase === 'day' ? (r.report || []).map(x => `<div class="rep">${esc(x)}</div>`).join('') : ''}
    ${sheriffLog}
    <h3 class="sec">👥 Живые игроки (${alive.length})</h3>${alive.map(p => pRow(p, r, viewer)).join('')}
    ${sorted.some(p => !p.alive) ? `<h3 class="sec">☠ Выбыли</h3>${sorted.filter(p => !p.alive).map(p => pRow(p, r, viewer)).join('')}` : ''}
    <div class="mini-row" style="margin-top:20px"><button class="btn-mini" data-a="leave">🚪 Выйти</button>${isHost ? '<button class="btn-mini danger" data-a="finish">Завершить игру</button>' : ''}</div>`;
}

initGame({
  key: 'mafia', collection: 'mafia_rooms', title: 'Мафия', icon: '🕵️',
  minPlayers: MIN, maxPlayers: MAX, needTheme: false, playersTitle: '👥 Игроки',
  render: ({ r, list, me, isHost }) => renderMafia(r, list, me, isHost),
  start: startMafia,
  lobbyFields: { ph: 0, day: 0, night: 0, act: null, nres: null, lastWords: null, report: [], voteNote: '', winner: null, paid: {}, startedAt: null, docSelf: null },
  chatLock: (r, me) => {
    if (r.status !== 'playing') return null;
    if (r.phase === 'night_act' || r.phase === 'night_end') return '🌙 Ночью чат недоступен';
    if (me && me.alive === false) return '☠ Выбывшие не пишут в чат';
    return null;
  },
  onReset: () => { splashKey = null; claiming = false; tryKey = null; $('mafNight').classList.add('hidden'); $('nLast').classList.add('hidden'); },
  actions: { vote, nPick, sendLast, setMafia, setDoctor }
});
</script>
</body>
</html>
