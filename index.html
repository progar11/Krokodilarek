<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Крокодил — онлайн игра для компании</title>
<meta name="description" content="Крокодил онлайн: создайте комнату, позовите друзей по коду и угадывайте слова.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F4EE; --surface:#fff; --surface-2:#F5F7F2;
  --primary:#1F8A5B; --primary-dark:#176B47; --primary-light:#E2F4EA;
  --accent:#F29B2C; --accent-light:#FDEFD9;
  --text:#18241D; --muted:#6B7A70; --border:#E0E6DD;
  --danger:#DC4545; --danger-bg:#FCEAEA; --blue:#2B6CB0;
  --radius:16px; --radius-sm:11px;
  --shadow:0 6px 24px -6px rgba(23,107,71,.18); --shadow-sm:0 2px 10px rgba(23,107,71,.08);
  --font-display:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body)}
h1,h2,h3,.btn,.badge,.brand{font-family:var(--font-display)}
body{background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:110px;-webkit-tap-highlight-color:transparent}
.hidden{display:none!important}
.strip{position:fixed;top:0;left:0;right:0;height:4px;z-index:1200;background:linear-gradient(90deg,var(--primary),var(--accent))}
.container{max-width:560px;margin:0 auto;padding:22px 16px}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.muted{color:var(--muted)}
h1{font-size:30px;font-weight:800;margin-bottom:6px}
h2{font-size:21px;font-weight:800;margin-bottom:10px}
h3{font-size:15px;font-weight:700}
.logo{font-size:64px;text-align:center;margin-bottom:10px}
.lead{font-size:15px;line-height:1.5;color:var(--muted);margin-bottom:20px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--primary);color:#fff;font-size:15px;font-weight:700;cursor:pointer;text-align:center;margin-top:10px;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary);padding:12px}
.btn-accent{background:var(--accent)}
.btn-danger{background:var(--danger)}
.btn-ghost{background:transparent;color:var(--muted);margin-top:4px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{margin-top:10px}
label{display:block;font-size:13px;font-weight:700;margin:6px 0 6px;color:var(--muted)}
input{width:100%;padding:13px 14px;margin-bottom:10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:16px;background:var(--surface);outline:none;color:var(--text)}
input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.hello{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary-light);color:var(--primary-dark);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;font-family:var(--font-display)}
/* комната */
.room-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:128px}
.code-chip{background:var(--primary-light);color:var(--primary-dark);font-weight:800;padding:8px 12px;border-radius:12px;font-size:14px;cursor:pointer;font-family:var(--font-display);word-break:break-all}
.theme{background:var(--accent-light);border-radius:var(--radius);padding:12px 14px;margin:12px 0;font-size:14px}
.theme b{display:block;font-size:12px;color:#B26A0B;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.player{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--radius);padding:12px;margin-bottom:8px;box-shadow:var(--shadow-sm);border:2px solid transparent}
.player.turn{border-color:var(--accent);background:var(--accent-light)}
.player.done{opacity:.85}
.player .info{flex:1;min-width:0}
.player .name{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;word-break:break-word}
.player .word{font-size:14px;margin-top:3px;color:var(--muted)}
.player .word b{color:var(--text);font-size:16px}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--primary-light);color:var(--primary-dark)}
.badge.turn{background:var(--accent);color:#fff}
.badge.place{background:#FFF3C4;color:#8A6200;font-size:12px}
.event{background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;color:var(--muted);margin:10px 0;text-align:center}
.turn-info{text-align:center;font-weight:800;font-size:17px;margin:12px 0;font-family:var(--font-display)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.08)}
.bar .btn-row{max-width:560px;margin:0 auto}
.bar .btn{margin-top:0;padding:16px}
.btn-yes{background:var(--primary)}
.btn-no{background:var(--danger)}
.fab{position:fixed;top:16px;right:14px;z-index:1100;width:auto;padding:10px 14px;margin:0;font-size:13px;border-radius:99px;background:var(--accent);box-shadow:0 6px 18px rgba(242,155,44,.5)}
.result{font-size:26px;width:44px;text-align:center;flex:none}
/* чат */
.chat-fab{position:fixed;right:14px;bottom:96px;z-index:1050;width:54px;height:54px;border-radius:50%;border:none;background:var(--blue);color:#fff;font-size:24px;box-shadow:0 6px 18px rgba(43,108,176,.45);cursor:pointer}
.chat-fab .dot{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--danger);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;font-family:var(--font-display)}
.chat{position:fixed;inset:0;z-index:1500;background:var(--bg);display:flex;flex-direction:column;height:100dvh}
.chat-top{display:flex;align-items:center;justify-content:space-between;padding:16px;background:var(--surface);box-shadow:var(--shadow-sm)}
.chat-close{border:none;background:var(--surface-2);width:38px;height:38px;border-radius:50%;font-size:16px;cursor:pointer}
.chat-msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:8px;max-width:560px;width:100%;margin:0 auto}
.msg{align-self:flex-start;max-width:82%;background:var(--surface);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:var(--shadow-sm)}
.msg.mine{align-self:flex-end;background:var(--primary-light);border-radius:16px 16px 4px 16px}
.msg .who{font-size:12px;font-weight:800;color:var(--primary-dark);margin-bottom:2px;font-family:var(--font-display)}
.msg .txt{font-size:15px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.chat-empty{text-align:center;color:var(--muted);font-size:14px;margin:auto}
.chat-input{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--surface);max-width:none}
.chat-input input{margin:0;flex:1}
.chat-input .btn{width:56px;margin:0;padding:0;font-size:18px}
/* модалка и тосты */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:#fff;border-radius:22px;padding:22px;max-width:340px;width:100%}
.modal p{font-size:16px;font-weight:700;line-height:1.4;text-align:center;margin-bottom:6px}
#toasts{position:fixed;top:16px;left:0;right:0;z-index:3000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:#18241D;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:90%;box-shadow:var(--shadow)}
.toast.error{background:var(--danger)}
.toast.success{background:var(--primary)}
</style>
</head>
<body>
<div class="strip"></div>
<div id="toasts"></div>

<!-- Вход -->
<section id="loginScreen" class="container center hidden">
  <div class="logo">🐊</div>
  <h1 style="text-align:center">Крокодил</h1>
  <p class="lead" style="text-align:center">Создай комнату, позови друзей по коду и угадай своё слово, задавая вопросы вживую. От 3 до 10 игроков.</p>
  <button class="btn" id="googleBtn">Войти через Google</button>
</section>

<!-- Имя -->
<section id="nameScreen" class="container center hidden">
  <div class="card">
    <h2>Как тебя зовут?</h2>
    <p class="lead" style="margin-bottom:12px">Это имя увидят все игроки.</p>
    <input id="nameInput" maxlength="20" placeholder="Твоё имя" autocomplete="off">
    <button class="btn" id="saveNameBtn">Сохранить</button>
    <button class="btn btn-ghost hidden" id="cancelNameBtn">Отмена</button>
  </div>
</section>

<!-- Меню -->
<section id="menuScreen" class="container hidden">
  <div class="card">
    <div class="hello">
      <div class="avatar" id="menuAvatar"></div>
      <div><h3 id="menuName"></h3><span class="muted" style="font-size:13px">Твой профиль</span></div>
    </div>
    <button class="btn btn-outline btn-sm" data-a="changeName" style="padding:9px;font-size:13px">Сменить имя</button>
  </div>
  <button class="btn" data-a="toCreate">🎲 Создать комнату</button>
  <button class="btn btn-outline" data-a="toJoin">🔑 Войти по коду</button>
  <button class="btn btn-ghost" data-a="logout">Выйти из аккаунта</button>
</section>

<!-- Создание -->
<section id="createScreen" class="container hidden">
  <div class="card">
    <h2>Новая комната</h2>
    <label>Код команды (по нему зайдут друзья)</label>
    <input id="cCode" maxlength="20" placeholder="Например: друзья2026" autocomplete="off">
    <label>Общая тема игры</label>
    <input id="cTheme" maxlength="60" placeholder="Например: животные, фильмы, еда" autocomplete="off">
    <p class="muted" style="font-size:13px">До 10 игроков. Начать можно, когда зашли минимум 3.</p>
    <button class="btn" id="createBtn">Создать</button>
    <button class="btn btn-ghost" data-a="toMenu">Назад</button>
  </div>
</section>

<!-- Вход по коду -->
<section id="joinScreen" class="container hidden">
  <div class="card">
    <h2>Вход в комнату</h2>
    <label>Код команды</label>
    <input id="jCode" maxlength="20" placeholder="Введи код" autocomplete="off">
    <button class="btn" id="joinBtn">Войти</button>
    <button class="btn btn-ghost" data-a="toMenu">Назад</button>
  </div>
</section>

<!-- Комната -->
<section id="roomScreen" class="container hidden">
  <div class="room-head">
    <div class="code-chip" data-a="copyCode" title="Нажми, чтобы скопировать">🔑 <span id="roomCode"></span></div>
    <span class="badge" id="roomCount"></span>
  </div>
  <div class="theme"><b>Тема</b><span id="roomTheme"></span></div>
  <div id="roomBody"></div>
</section>

<button class="btn fab hidden" id="winFab" data-a="win">🏆 Я выиграл</button>
<div class="bar hidden" id="turnBar">
  <div class="btn-row">
    <button class="btn btn-yes" data-a="guessed">✅ Угадал</button>
    <button class="btn btn-no" data-a="notGuessed">❌ Не угадал</button>
  </div>
</div>
<button class="chat-fab hidden" id="chatFab" data-a="openChat">💬<span class="dot hidden" id="chatDot"></span></button>
<div class="chat hidden" id="chatPanel">
  <div class="chat-top"><h3>💬 Чат комнаты</h3><button class="chat-close" data-a="closeChat">✕</button></div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="chat-input"><input id="chatInput" maxlength="300" placeholder="Сообщение…" autocomplete="off"><button class="btn" data-a="sendChat">➤</button></div>
</div>
<div class="modal hidden" id="modal"><div class="box"><p id="modalText"></p>
  <div class="btn-row"><button class="btn btn-outline" id="modalNo">Нет</button><button class="btn" id="modalYes">Да</button></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, runTransaction, deleteField, collection, addDoc, getDocs, writeBatch, query, orderBy, limitToLast, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA1yt8qsvTZ2dYajtWXShhutaGBouCMP5w",
  authDomain: "poputka-2ab91.firebaseapp.com",
  projectId: "poputka-2ab91",
  storageBucket: "poputka-2ab91.firebasestorage.app",
  messagingSenderId: "261108566922",
  appId: "1:261108566922:web:ba7649d9dba2b709e91673",
  measurementId: "G-W3TQ8ZW128"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const MAX_PLAYERS = 10, MIN_PLAYERS = 3;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roomRef = (code) => doc(db, 'rooms', code);

let user = null, myName = '', roomCode = null, room = null, unsub = null, assigning = false, bodyKey = '';

/* ===== Утилиты ===== */
function toast(msg, type = 'info') {
  const el = document.createElement('div');
  el.className = 'toast ' + type; el.textContent = msg;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 3200);
}
function show(id) {
  ['loginScreen','nameScreen','menuScreen','createScreen','joinScreen','roomScreen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  if (id !== 'roomScreen') { $('winFab').classList.add('hidden'); $('turnBar').classList.add('hidden'); }
  $('chatFab').classList.toggle('hidden', id !== 'roomScreen');
  window.scrollTo(0, 0);
}
function ask(text) {
  return new Promise(res => {
    $('modalText').textContent = text; $('modal').classList.remove('hidden');
    const done = (v) => { $('modal').classList.add('hidden'); $('modalYes').onclick = $('modalNo').onclick = null; res(v); };
    $('modalYes').onclick = () => done(true); $('modalNo').onclick = () => done(false);
  });
}
const normCode = (s) => s.trim().toLowerCase().replace(/[\s\/\\.#?]+/g, '');
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const placeLabel = (n) => ['🥇', '🥈', '🥉'][n - 1] || `${n} место`;
const initial = (n) => (n || '?').trim().charAt(0).toUpperCase();
function errMsg(e) { return (e && e.message && !String(e.message).startsWith('Firebase')) ? e.message : 'Ошибка связи. Попробуй ещё раз.'; }

/* ===== Авторизация ===== */
$('googleBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('Ошибка входа: ' + e.message, 'error'));

onAuthStateChanged(auth, async (u) => {
  user = u;
  if (!u) { leaveLocal(); show('loginScreen'); return; }
  try {
    const s = await getDoc(doc(db, 'users', u.uid));
    if (s.exists() && s.data().name) { myName = s.data().name; }
    else { openNameScreen(false); return; }
  } catch (e) { toast('Не удалось загрузить профиль. Проверь правила Firestore.', 'error'); show('menuScreen'); return; }
  showMenu();
  let saved = null; try { saved = localStorage.getItem('croc_room'); } catch (e) {}
  if (saved) enterRoom(saved, true);
});

function showMenu() {
  $('menuName').textContent = myName; $('menuAvatar').textContent = initial(myName); show('menuScreen');
}
function openNameScreen(canCancel) {
  $('nameInput').value = myName || user.displayName || '';
  $('cancelNameBtn').classList.toggle('hidden', !canCancel);
  show('nameScreen');
}
$('saveNameBtn').onclick = async () => {
  const n = $('nameInput').value.trim().replace(/\s+/g, ' ');
  if (n.length < 2) return toast('Имя должно быть минимум 2 символа', 'error');
  try {
    await setDoc(doc(db, 'users', user.uid), { name: n });
    myName = n; showMenu();
    let saved = null; try { saved = localStorage.getItem('croc_room'); } catch (e) {}
    if (saved && !room) enterRoom(saved, true);
  } catch (e) { toast('Не удалось сохранить имя', 'error'); }
};
$('cancelNameBtn').onclick = showMenu;

/* ===== Создание и вход в комнату ===== */
$('createBtn').onclick = async () => {
  const code = normCode($('cCode').value), theme = $('cTheme').value.trim();
  if (code.length < 3) return toast('Код: минимум 3 символа (без пробелов)', 'error');
  if (theme.length < 2) return toast('Укажи общую тему игры', 'error');
  $('createBtn').disabled = true;
  try {
    const ref = roomRef(code);
    await runTransaction(db, async (tx) => {
      const s = await tx.get(ref);
      if (s.exists()) throw new Error('Такой код уже занят, придумай другой');
      tx.set(ref, {
        code, theme, hostId: user.uid, status: 'lobby', createdAt: Date.now(),
        players: { [user.uid]: { name: myName, joinedAt: Date.now(), word: null, place: null } },
        words: {}, order: [], turn: null, placeCount: 0, lastEvent: '',
        expireAt: Timestamp.fromMillis(Date.now() + 24 * 3600 * 1000)
      });
    });
    $('cCode').value = ''; $('cTheme').value = '';
    enterRoom(code);
  } catch (e) { toast(errMsg(e), 'error'); }
  $('createBtn').disabled = false;
};

$('joinBtn').onclick = async () => {
  const code = normCode($('jCode').value);
  if (!code) return toast('Введи код', 'error');
  $('joinBtn').disabled = true;
  try {
    const ref = roomRef(code);
    await runTransaction(db, async (tx) => {
      const s = await tx.get(ref);
      if (!s.exists()) throw new Error('Комната с таким кодом не найдена');
      const d = s.data();
      if (d.players[user.uid]) return;
      if (d.status !== 'lobby') throw new Error('Игра уже началась');
      if (Object.keys(d.players).length >= MAX_PLAYERS) throw new Error('Комната заполнена (10/10)');
      tx.update(ref, { ['players.' + user.uid]: { name: myName, joinedAt: Date.now(), word: null, place: null } });
    });
    $('jCode').value = '';
    enterRoom(code);
  } catch (e) { toast(errMsg(e), 'error'); }
  $('joinBtn').disabled = false;
};

function enterRoom(code, silent) {
  if (unsub) unsub();
  roomCode = code; room = null; bodyKey = '';
  try { localStorage.setItem('croc_room', code); } catch (e) {}
  startChat(code);
  let first = true;
  unsub = onSnapshot(roomRef(code), (snap) => {
    if (!snap.exists()) { leaveLocal(); showMenu(); if (!(first && silent)) toast('Комната закрыта или не найдена'); first = false; return; }
    const d = snap.data();
    if (!d.players[user.uid]) { leaveLocal(); showMenu(); toast('Тебя нет в этой комнате'); first = false; return; }
    first = false; room = d; render();
  }, () => { leaveLocal(); showMenu(); toast('Нет доступа к комнате', 'error'); });
}

function leaveLocal() {
  if (unsub) { unsub(); unsub = null; }
  stopChat();
  room = null; roomCode = null; bodyKey = ''; assigning = false;
  try { localStorage.removeItem('croc_room'); } catch (e) {}
  $('winFab').classList.add('hidden'); $('turnBar').classList.add('hidden');
  if (user && !$('roomScreen').classList.contains('hidden')) showMenu();
}

/* ===== Игровая логика (транзакции) ===== */
const playersSorted = (r) => Object.entries(r.players).map(([id, p]) => ({ id, ...p })).sort((a, b) => a.joinedAt - b.joinedAt);

async function startGame() {
  try {
    await runTransaction(db, async (tx) => {
      const ref = roomRef(roomCode), s = await tx.get(ref), d = s.data();
      if (d.status !== 'lobby') return;
      const list = playersSorted(d);
      if (list.length < MIN_PLAYERS) throw new Error('Нужно минимум 3 игрока');
      const upd = { status: 'words', words: {}, order: list.map(p => p.id), turn: null, placeCount: 0, lastEvent: '' };
      list.forEach(p => { upd['players.' + p.id + '.word'] = null; upd['players.' + p.id + '.place'] = null; });
      tx.update(ref, upd);
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}

function derange(ids) {
  for (let t = 0; t < 300; t++) {
    const p = shuffle(ids.slice());
    if (p.every((x, i) => x !== ids[i])) return p;
  }
  return ids.slice(1).concat(ids[0]);
}

async function assignWords() {
  if (assigning) return; assigning = true;
  try {
    await runTransaction(db, async (tx) => {
      const ref = roomRef(roomCode), s = await tx.get(ref), d = s.data();
      if (d.status !== 'words') return;
      const ids = d.order;
      if (!ids.every(id => d.words && d.words[id])) return;
      const authors = derange(ids);           // authors[i] — чьё слово достаётся игроку ids[i]
      const upd = { status: 'playing', turn: ids[Math.floor(Math.random() * ids.length)], lastEvent: 'Игра началась! Задавайте вопросы вживую.' };
      ids.forEach((id, i) => { upd['players.' + id + '.word'] = d.words[authors[i]]; upd['players.' + id + '.author'] = authors[i]; });
      tx.update(ref, upd);
    });
  } catch (e) { toast(errMsg(e), 'error'); }
  assigning = false;
}

async function submitWord() {
  const w = $('wordInput').value.trim().replace(/\s+/g, ' ');
  if (!w) return toast('Введи слово', 'error');
  try { await updateDoc(roomRef(roomCode), { ['words.' + user.uid]: w }); }
  catch (e) { toast('Не удалось отправить слово', 'error'); }
}

function nextActive(order, players, fromId) {
  const n = order.length, i = order.indexOf(fromId);
  for (let k = 1; k <= n; k++) {
    const id = order[(i + k) % n];
    if (players[id].place == null) return id;
  }
  return null;
}

async function turnAction(kind) {
  try {
    await runTransaction(db, async (tx) => {
      const ref = roomRef(roomCode), s = await tx.get(ref), d = s.data();
      if (d.status !== 'playing' || d.turn !== user.uid) return;
      if (kind === 'guessed') {
        tx.update(ref, { lastEvent: `✅ ${myName} угадал и задаёт ещё вопрос` });
      } else {
        const nxt = nextActive(d.order, d.players, user.uid);
        tx.update(ref, { turn: nxt, lastEvent: `❌ ${myName} не угадал — ход переходит дальше` });
      }
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}

async function iWon() {
  if (!(await ask('Ты точно угадал своё слово?'))) return;
  try {
    await runTransaction(db, async (tx) => {
      const ref = roomRef(roomCode), s = await tx.get(ref), d = s.data();
      if (d.status !== 'playing' || d.players[user.uid].place != null) return;
      const place = (d.placeCount || 0) + 1;
      const players = JSON.parse(JSON.stringify(d.players));
      players[user.uid].place = place;
      const remaining = d.order.filter(id => players[id].place == null);
      const upd = { ['players.' + user.uid + '.place']: place, placeCount: place, lastEvent: `🏆 ${myName} угадал слово и занял ${place} место!` };
      if (d.turn === user.uid) upd.turn = remaining.length ? nextActive(d.order, players, user.uid) : null;
      if (remaining.length <= 1) {
        upd.status = 'finished'; upd.turn = null;
        if (remaining.length === 1) { upd['players.' + remaining[0] + '.place'] = place + 1; upd.placeCount = place + 1; }
      }
      tx.update(ref, upd);
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}

async function toLobby() {
  try {
    await runTransaction(db, async (tx) => {
      const ref = roomRef(roomCode), s = await tx.get(ref), d = s.data();
      const players = {};
      Object.entries(d.players).forEach(([id, p]) => { players[id] = { name: p.name, joinedAt: p.joinedAt, word: null, place: null }; });
      tx.update(ref, { players, status: 'lobby', words: {}, order: [], turn: null, placeCount: 0, lastEvent: '' });
    });
  } catch (e) { toast(errMsg(e), 'error'); }
}

async function finishGame() {
  if (!(await ask('Завершить игру для всех?'))) return;
  try { await updateDoc(roomRef(roomCode), { status: 'finished', turn: null, lastEvent: 'Игра завершена ведущим' }); }
  catch (e) { toast('Ошибка', 'error'); }
}

async function wipeRoom(code) {
  // сначала сообщения, потом сама комната — в базе не остаётся ничего
  const snap = await getDocs(collection(db, 'rooms', code, 'messages'));
  for (let i = 0; i < snap.docs.length; i += 450) {
    const b = writeBatch(db);
    snap.docs.slice(i, i + 450).forEach(d => b.delete(d.ref));
    await b.commit();
  }
  await deleteDoc(roomRef(code));
}

async function leaveRoom() {
  const code = roomCode, r = room;
  const alone = r && Object.keys(r.players).length === 1 && r.hostId === user.uid;
  const lobbyGuest = r && r.status === 'lobby' && r.hostId !== user.uid;
  if (lobbyGuest) { try { await updateDoc(roomRef(code), { ['players.' + user.uid]: deleteField() }); } catch (e) {} }
  leaveLocal(); showMenu();
  if (alone) { try { await wipeRoom(code); } catch (e) {} }   // последний игрок ушёл — комната удаляется
}
async function closeRoom() {
  if (!(await ask('Закрыть комнату? Комната и весь чат будут удалены.'))) return;
  try { await wipeRoom(roomCode); } catch (e) { toast('Не удалось закрыть комнату', 'error'); }
}

/* ===== Чат ===== */
let chatUnsub = null, chatOpen = false, chatInit = false, unread = 0;
function updateDot() { const d = $('chatDot'); d.textContent = unread > 9 ? '9+' : unread; d.classList.toggle('hidden', unread === 0); }
function chatBottom() { const b = $('chatMsgs'); b.scrollTop = b.scrollHeight; }
function appendMsg(m) {
  const box = $('chatMsgs');
  const empty = box.querySelector('.chat-empty'); if (empty) empty.remove();
  const el = document.createElement('div');
  el.className = 'msg' + (m.uid === user.uid ? ' mine' : '');
  el.innerHTML = (m.uid === user.uid ? '' : `<div class="who">${esc(m.name)}</div>`) + `<div class="txt">${esc(m.text)}</div>`;
  box.appendChild(el);
  while (box.children.length > 150) box.removeChild(box.firstChild);
}
function startChat(code) {
  stopChat(); chatInit = false; unread = 0; updateDot();
  $('chatMsgs').innerHTML = '<div class="chat-empty">Сообщений пока нет.<br>Напиши первым 👋</div>';
  const q = query(collection(db, 'rooms', code, 'messages'), orderBy('t'), limitToLast(100));
  chatUnsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach(ch => {
      if (ch.type !== 'added') return;
      const m = ch.doc.data(); appendMsg(m);
      if (chatInit && !chatOpen && m.uid !== user.uid) unread++;
    });
    chatInit = true; updateDot(); if (chatOpen) chatBottom();
  }, () => {});
}
function stopChat() {
  if (chatUnsub) { chatUnsub(); chatUnsub = null; }
  chatOpen = false; unread = 0; $('chatPanel').classList.add('hidden');
}
async function sendChat() {
  const inp = $('chatInput'), text = inp.value.trim();
  if (!text || !roomCode) return;
  inp.value = ''; inp.focus();
  try {
    await addDoc(collection(db, 'rooms', roomCode, 'messages'), {
      uid: user.uid, name: myName, text: text.slice(0, 300), t: Date.now(),
      expireAt: Timestamp.fromMillis(Date.now() + 24 * 3600 * 1000)
    });
  } catch (e) { toast('Сообщение не отправлено', 'error'); }
}

/* ===== Отрисовка комнаты ===== */
function playerCard(p, r, opts = {}) {
  const isTurn = r.status === 'playing' && r.turn === p.id && p.place == null;
  let word = '';
  if (r.status === 'playing' || r.status === 'finished') {
    if (p.word) {
      if (p.id === user.uid && p.place == null && r.status === 'playing') word = '<div class="word">🙈 Своё слово не видно</div>';
      else word = `<div class="word">Слово: <b>${esc(p.word)}</b></div>`;
    }
  }
  const badges = [
    r.hostId === p.id ? '<span class="badge">👑 ведущий</span>' : '',
    isTurn ? '<span class="badge turn">ХОД</span>' : '',
    p.place != null ? `<span class="badge place">${placeLabel(p.place)}</span>` : ''
  ].join('');
  return `<div class="player ${isTurn ? 'turn' : ''} ${p.place != null ? 'done' : ''}">
    <div class="avatar">${esc(initial(p.name))}</div>
    <div class="info"><div class="name">${esc(p.name)}${p.id === user.uid ? ' <span class="muted" style="font-weight:500">(ты)</span>' : ''} ${badges}</div>${word}${opts.extra || ''}</div>
  </div>`;
}

function render() {
  const r = room, isHost = r.hostId === user.uid, me = r.players[user.uid];
  const list = playersSorted(r);
  $('roomCode').textContent = r.code; $('roomTheme').textContent = r.theme;
  $('roomCount').textContent = `👥 ${list.length}/${MAX_PLAYERS}`;
  show('roomScreen');
  $('winFab').classList.add('hidden'); $('turnBar').classList.add('hidden');
  const body = $('roomBody');

  if (r.status === 'lobby') {
    bodyKey = 'lobby';
    body.innerHTML = `<h3 style="margin:6px 0 10px">Игроки</h3>${list.map(p => playerCard(p, r)).join('')}
      <p class="muted" style="font-size:13px;text-align:center;margin:10px 0">Отправь друзьям код <b>${esc(r.code)}</b></p>
      ${isHost ? `<button class="btn" data-a="start" ${list.length < MIN_PLAYERS ? 'disabled' : ''}>${list.length < MIN_PLAYERS ? 'Нужно минимум 3 игрока' : '▶ Начать игру'}</button>
      <button class="btn btn-ghost" data-a="closeRoom" style="color:var(--danger)">Закрыть комнату</button>`
      : '<p class="muted" style="text-align:center;margin:14px 0">Ждём, пока ведущий начнёт игру…</p>'}
      <button class="btn btn-ghost" data-a="leave">Выйти из комнаты</button>`;
    return;
  }

  if (r.status === 'words') {
    const submitted = !!(r.words && r.words[user.uid]);
    const cnt = list.filter(p => r.words && r.words[p.id]).length;
    const status = `<h3 style="margin:14px 0 10px">Загадали слово: ${cnt}/${list.length}</h3>` +
      list.map(p => playerCard(p, r, { extra: `<div class="word">${r.words && r.words[p.id] ? '✅ готово' : '⏳ думает…'}</div>` })).join('');
    const key = 'words-' + submitted;
    if (bodyKey !== key) {
      bodyKey = key;
      body.innerHTML = (submitted
        ? `<div class="card"><h2>Слово отправлено ✅</h2><p class="muted">Ждём остальных игроков…</p></div>`
        : `<div class="card"><h2>Загадай слово</h2><p class="muted" style="font-size:14px;margin-bottom:12px">Слово по теме «${esc(r.theme)}». Оно случайно достанется другому игроку — ты его увидишь, а он нет.</p>
            <input id="wordInput" maxlength="40" placeholder="Твоё слово" autocomplete="off">
            <button class="btn" data-a="sendWord">Отправить</button></div>`)
        + '<div id="wordsList"></div>'
        + (isHost ? '<button class="btn btn-ghost" data-a="toLobby">Отменить и вернуться в лобби</button>' : '');
    }
    $('wordsList').innerHTML = status;
    if (isHost && cnt === list.length) assignWords();
    return;
  }

  if (r.status === 'playing') {
    bodyKey = 'playing';
    const turnP = r.players[r.turn];
    const myTurn = r.turn === user.uid && me.place == null;
    const sorted = list.slice().sort((a, b) => (r.order.indexOf(a.id)) - (r.order.indexOf(b.id)));
    body.innerHTML = `${r.lastEvent ? `<div class="event">${esc(r.lastEvent)}</div>` : ''}
      <div class="turn-info">${myTurn ? '👉 Твой ход!' : turnP ? `Сейчас ходит: ${esc(turnP.name)}` : ''}</div>
      ${me.place != null ? `<div class="event">Ты занял ${placeLabel(me.place)} и теперь наблюдаешь</div>` : ''}
      ${sorted.map(p => playerCard(p, r)).join('')}
      ${isHost ? '<button class="btn btn-ghost" data-a="finish" style="color:var(--danger)">Завершить игру</button>' : ''}
      <button class="btn btn-ghost" data-a="leave">Выйти в меню</button>`;
    if (me.place == null) $('winFab').classList.remove('hidden');
    if (myTurn) $('turnBar').classList.remove('hidden');
    return;
  }

  if (r.status === 'finished') {
    bodyKey = 'finished';
    const placed = list.filter(p => p.place != null).sort((a, b) => a.place - b.place);
    const rest = list.filter(p => p.place == null);
    body.innerHTML = `${r.lastEvent ? `<div class="event">${esc(r.lastEvent)}</div>` : ''}
      <h2 style="margin:10px 0">🏁 Итоги</h2>
      ${placed.map(p => playerCard(p, r)).join('')}
      ${rest.map(p => playerCard(p, r)).join('')}
      ${isHost ? '<button class="btn" data-a="toLobby">🔄 Играть снова</button><button class="btn btn-ghost" data-a="closeRoom" style="color:var(--danger)">Закрыть комнату</button>'
      : '<p class="muted" style="text-align:center;margin:14px 0">Ведущий может запустить новую игру</p>'}
      <button class="btn btn-ghost" data-a="leave">Выйти в меню</button>`;
  }
}

/* ===== Клики ===== */
const actions = {
  toCreate: () => show('createScreen'),
  toJoin: () => show('joinScreen'),
  toMenu: showMenu,
  changeName: () => openNameScreen(true),
  logout: () => signOut(auth),
  copyCode: async () => { try { await navigator.clipboard.writeText(roomCode); toast('Код скопирован', 'success'); } catch (e) { toast('Код: ' + roomCode); } },
  start: startGame, sendWord: submitWord, guessed: () => turnAction('guessed'), notGuessed: () => turnAction('notGuessed'),
  openChat: () => { chatOpen = true; unread = 0; updateDot(); $('chatPanel').classList.remove('hidden'); chatBottom(); },
  closeChat: () => { chatOpen = false; $('chatPanel').classList.add('hidden'); },
  sendChat,
  win: iWon, toLobby, finish: finishGame, leave: leaveRoom, closeRoom
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (el && actions[el.dataset.a]) actions[el.dataset.a]();
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'wordInput') submitWord();
  if (e.target.id === 'jCode') $('joinBtn').click();
  if (e.target.id === 'chatInput') sendChat();
});
</script>
</body>
