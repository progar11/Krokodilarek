<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Крокодил Арек — онлайн игра для компании</title>
<meta name="description" content="Крокодил Арек — онлайн игра на GitHub Pages: создайте комнату, позовите друзей по коду и угадывайте слова. От 2 до 10 игроков (Бункер — от 3).">
<meta name="keywords" content="Крокодил Арек, Крокодил Арек гитхаб, Крокодил гитхаб, Арек гитхаб, крокодил онлайн игра">
<meta name="application-name" content="Крокодил Арек">
<meta name="robots" content="index, follow">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Крокодил Арек">
<meta property="og:title" content="Крокодил Арек — онлайн игра для компании">
<meta property="og:description" content="Создай комнату, позови друзей по коду и угадывай слова вживую.">
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"WebSite","name":"Крокодил Арек","alternateName":["Крокодил Арек гитхаб","Крокодил гитхаб","Арек гитхаб"],"inLanguage":"ru"}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="strip"></div>

<!-- Вход -->
<section id="loginScreen" class="container center hidden">
  <span class="logo">🐊</span>
  <h1 style="text-align:center">Крокодил Арек</h1>
  <p class="lead" style="text-align:center">Две игры для компании: «Крокодил» и «Бункер». Создай комнату, позови друзей по коду. От 2 до 10 игроков (Бункер — от 3).</p>
  <button class="btn btn-blue" id="googleBtn">Войти через Google</button>
</section>

<!-- Имя -->
<section id="nameScreen" class="container center hidden">
  <div class="card">
    <h2>Как тебя зовут?</h2>
    <p class="lead" style="margin-bottom:12px">Это имя увидят все игроки.</p>
    <input id="nameInput" maxlength="20" placeholder="Твоё имя" autocomplete="off">
    <button class="btn btn-teal" id="saveNameBtn">Сохранить</button>
    <button class="btn btn-soft hidden" id="cancelNameBtn">Отмена</button>
  </div>
</section>

<!-- Меню -->
<section id="menuScreen" class="container hidden">
  <div class="card">
    <div class="hello">
      <div class="avatar" id="menuAvatar"></div>
      <div style="flex:1;min-width:0"><h3 id="menuName"></h3><span class="muted" style="font-size:13px" id="menuSub">Твой профиль</span></div>
      <div class="coins" data-coins>🪙 0</div>
    </div>
    <button class="btn btn-purple btn-sm" data-a="changeName" style="margin-top:0">✏️ Сменить имя</button>
  </div>
  <div class="card wheel-card">
    <h3>🎡 Колесо фортуны</h3>
    <span class="muted" style="font-size:13px">Одна попытка раз в 12 часов: 5, 10 или 15 монет</span>
    <div class="wheel-wrap"><div class="wheel-ptr"></div><canvas id="wheelCv" width="600" height="600"></canvas><div class="wheel-hub">🪙</div></div>
    <div class="wheel-res" id="wheelRes"></div>
    <button class="btn btn-orange" id="wheelBtn" data-a="spinWheel">🎡 Крутить</button>
  </div>  <h3 style="margin:4px 2px 8px">Выбери игру</h3>
  <div class="gsel">
    <button class="gopt" data-a="goto" data-href="krokodil.html" data-k="krokodil" data-ic="🐊" data-n="Крокодил"><span>🐊</span>Крокодил</button>
    <button class="gopt" data-a="goto" data-href="bunker.html" data-k="bunker" data-ic="🏚️" data-n="Бункер"><span>🏚️</span>Бункер</button>
  </div>
  <button class="btn btn-orange" data-a="openShop">🛒 Магазин</button>
  <button class="btn btn-soft-red" data-a="logout" style="margin-top:18px">Выйти из аккаунта</button>
</section>

<script type="module">
import { $, esc, P, db, auth, doc, setDoc, runTransaction, signInWithPopup, GoogleAuthProvider, signOut,
  startSession, subscribeProfile, onProfile, paintCoins, toast, errMsg, confetti, nameHtml, initial, avStyle, registerActions, openShop } from './shared.js';

const SPIN_COOLDOWN = 12 * 3600 * 1000;
// 30 ячеек: победные (15 шт: по 5 штук 15/10/5) стоят через одну с «не повезло» (0)
const WHEEL_VALS = [15, 5, 10, 5, 15, 10, 5, 10, 15, 5, 10, 15, 10, 5, 15];
const WHEEL = Array.from({ length: 30 }, (_, i) => i % 2 === 0 ? WHEEL_VALS[i / 2] : 0);
let wheelRot = 0;

function show(id) {
  ['loginScreen', 'nameScreen', 'menuScreen'].forEach(s => $(s).classList.toggle('hidden', s !== id));
  window.scrollTo(0, 0);
}
function paintMenuName() { $('menuName').innerHTML = nameHtml({ name: P.name, title: P.title }); }
function paintGameButtons() {
  document.querySelectorAll('.gopt').forEach(b => {
    let code = null; try { code = localStorage.getItem(b.dataset.k + '_room'); } catch (e) {}
    b.innerHTML = `<span>${b.dataset.ic}</span>${b.dataset.n}` + (code ? `<small class="muted" style="display:block;font-size:11px;font-weight:600;margin-top:2px">↩ комната ${esc(code)}</small>` : '');
  });
}
function showMenu() {
  paintGameButtons(); paintCoins(); paintWheel(); paintMenuName();
  $('menuAvatar').textContent = initial(P.name); $('menuAvatar').style.cssText = avStyle(P.name);
  show('menuScreen');
}
function openNameScreen(canCancel) {
  $('nameInput').value = P.name || P.user.displayName || '';
  $('cancelNameBtn').classList.toggle('hidden', !canCancel);
  show('nameScreen');
}

/* ===== Вход и имя ===== */
$('googleBtn').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e => toast('Ошибка входа: ' + e.message, 'error'));
$('saveNameBtn').onclick = async () => {
  const n = $('nameInput').value.trim().replace(/\s+/g, ' ');
  if (n.length < 2) return toast('Имя должно быть минимум 2 символа', 'error');
  try {
    await setDoc(doc(db, 'users', P.user.uid), { name: n, coins: P.coins }, { merge: true });
    P.name = n; subscribeProfile(); showMenu();
  } catch (e) { toast('Не удалось сохранить имя', 'error'); }
};
$('cancelNameBtn').onclick = showMenu;

/* ===== КОЛЕСО ФОРТУНЫ ===== */
function drawWheel() {
  const cv = $('wheelCv'); if (!cv) return;
  const c = cv.getContext('2d'), R = 300, n = WHEEL.length, step = Math.PI * 2 / n;
  const col = { 15: '#F2B233', 10: '#2FA36B', 5: '#4C8BD9', 0: '#D5DDD7' };
  c.clearRect(0, 0, 600, 600);
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * step;
    c.beginPath(); c.moveTo(R, R); c.arc(R, R, R - 3, a0, a0 + step); c.closePath();
    c.fillStyle = col[WHEEL[i]]; c.fill();
    c.lineWidth = 2; c.strokeStyle = '#fff'; c.stroke();
    c.save(); c.translate(R, R); c.rotate(a0 + step / 2);
    c.textAlign = 'right'; c.textBaseline = 'middle';
    c.fillStyle = WHEEL[i] ? '#fff' : '#7A8A7F';
    c.font = '800 ' + (WHEEL[i] ? 30 : 24) + 'px Manrope, sans-serif';
    c.fillText(WHEEL[i] ? String(WHEEL[i]) : '✕', R - 22, 0);
    c.restore();
  }
}
const wheelLeft = () => Math.max(0, P.lastSpin + SPIN_COOLDOWN - Date.now());
function fmtLeft(ms) {
  const t = Math.ceil(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return [h, m, s].map(v => String(v).padStart(2, '0')).join(':');
}
function paintWheel() {
  const b = $('wheelBtn'); if (!b) return;
  const left = wheelLeft();
  b.disabled = P.spinning || left > 0;
  b.textContent = P.spinning ? '🎡 Крутится…' : (left > 0 ? '⏳ Следующая попытка через ' + fmtLeft(left) : '🎡 Крутить');
}
async function spinWheel() {
  if (P.spinning || wheelLeft() > 0) return;
  P.spinning = true; paintWheel(); $('wheelRes').textContent = '';
  let idx = 0, now = 0;
  try {
    await runTransaction(db, async (tx) => {
      const uref = doc(db, 'users', P.user.uid), d = (await tx.get(uref)).data() || {};
      now = Date.now();
      if (now - (d.lastSpin || 0) < SPIN_COOLDOWN) { P.lastSpin = d.lastSpin || 0; throw new Error('Колесо уже крутили — приходи позже'); }
      idx = Math.floor(Math.random() * WHEEL.length);
      tx.update(uref, { coins: (d.coins || 0) + WHEEL[idx], lastSpin: now });
    });
  } catch (e) { P.spinning = false; paintWheel(); toast(errMsg(e), 'error'); return; }
  P.lastSpin = now;
  const target = -(idx + 0.5) * (360 / WHEEL.length) + (Math.random() * 8 - 4);
  wheelRot += 360 * 6 + ((((target - wheelRot) % 360) + 360) % 360);
  $('wheelCv').style.transform = `rotate(${wheelRot}deg)`;
  setTimeout(() => {
    P.spinning = false; paintCoins(); paintWheel();
    const prize = WHEEL[idx];
    $('wheelRes').textContent = prize ? `🎉 Выпало +${prize} монет!` : '😢 Не повезло';
    if (prize) { confetti(); toast(`🎡 +${prize} монет!`, 'success'); } else toast('🎡 Не повезло, попробуй позже');
  }, 5200);
}
drawWheel();
setInterval(() => { if (!$('menuScreen').classList.contains('hidden')) paintWheel(); }, 1000);

onProfile(() => { paintMenuName(); paintWheel(); });
registerActions({
  spinWheel,
  goto: (el) => { location.href = el.dataset.href; },
  changeName: () => openNameScreen(true),
  logout: () => signOut(auth)
});
startSession({
  onLoggedOut: () => show('loginScreen'),
  onNoName: () => openNameScreen(false),
  onError: () => show('menuScreen'),
  onReady: showMenu
});
</script>
</body>
</html>
