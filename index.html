<!DOCTYPE html>

<title>Крокодил и Бункер Онлайн</title>
<style>
  * { box-sizing: border-box; }

  .game-pick { display: flex; gap: 10px; }

  .game-pick small { display: block; font-size: 13px; opacity: .85; margin-top: 6px; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #ddd; padding: 8px 12px; display: flex; gap: 10px; z-index: 150; }
  #bar button { margin: 0; position: relative; }
  .badge { background: #EA4335; border-radius: 10px; padding: 1px 7px; font-size: 12px; margin-left: 6px; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; top: 12%; background: #fff; border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.25); z-index: 200; display: flex; flex-direction: column; max-width: 600px; margin: 0 auto; }
  #sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; }
  #sheet-head button { width: auto; margin: 0; padding: 6px 12px; background: #6b7280; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #sheet-chat { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #chat-msgs { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #chat-form { display: flex; gap: 8px; padding: 8px 12px 14px; border-top: 1px solid #eee; }
  #chat-form input { margin: 0; } #chat-form button { width: 90px; margin: 0; }
  .msg { margin: 6px 0; } .msg b { color: #4285F4; } .msg.me b { color: #34A853; } .msg i { color: #999; font-size: 11px; margin-left: 6px; font-style: normal; }

<button id="win-btn" class="hidden" onclick="declareWin()">🏆 Я выиграл!</button>

<div class="card" id="app">

    <button onclick="loginWithGoogle()">Войти через Google</button>

    </div>
  </div>

  <!-- Меню игры -->
  <div id="screen-menu" class="hidden">
    <h2 id="menu-title">Главное меню</h2>
    <button onclick="createRoomModal()">Создать комнату</button>
    <hr>
    <input type="text" id="join-code" placeholder="Код комнаты">
    <button onclick="joinRoom()">Войти в комнату</button>
    <button class="gray" onclick="showScreen('screen-select')">← Выбрать другую игру</button>
  </div>

  <!-- Комната ожидания -->
  <div id="screen-room" class="hidden">

    <p>Код комнаты: <strong id="room-code-display"></strong></p>
    <h3>Игроки (макс. 10):</h3>
    <div id="players-list"></div>
    <button id="start-game-btn" class="hidden" onclick="startGame()">Начать игру (нужно мин. 3)</button>
    <button class="gray" onclick="leaveToMenu()">Выйти в меню</button>
  </div>

  <!-- Крокодил: ввод слов -->
  <div id="screen-word-input" class="hidden">
    <h2>Фаза ввода слов</h2>
    <p>Тема комнаты: <strong id="input-theme"></strong></p>
    <p>Введите слово, связанное с темой, которое отгадают другие:</p>
    <input type="text" id="secret-word-input" placeholder="Ваше слово">
    <button onclick="submitWord()">Отправить слово</button>
  </div>

  <!-- Крокодил: игра -->
  <div id="screen-game" class="hidden">
    <h2>Идет игра! 🐊</h2>
    <p>Ход игрока: <strong id="current-turn-name"></strong></p>
    <div id="game-players-list"></div>
    <div id="turn-controls" class="hidden" style="margin-top:20px;border-top:2px solid #ccc;padding-top:10px;">
      <p>Ваша очередь управлять вопросом:</p>
      <button class="green" onclick="handleGuessResult(true)">Угадал (+ ход)</button>
      <button class="red" onclick="handleGuessResult(false)">Не угадал (переход хода)</button>
    </div>
  </div>

  <!-- Бункер -->
  <div id="screen-bunker" class="hidden">
    <h2>☢️ Бункер — раунд <span id="b-round"></span></h2>
    <div class="box" id="b-world"></div>
    <div class="status" id="b-status"></div>
    <div id="b-vote" class="hidden"></div>
    <div id="b-me"></div>
    <div id="b-end" class="hidden"></div>
  </div>
</div>

<!-- Нижняя панель: игроки / чат -->
<div id="bar" class="hidden">
  <button onclick="openSheet('players')">👥 Игроки</button>
  <button onclick="openSheet('chat')">💬 Чат<span id="chat-badge" class="badge hidden">0</span></button>
</div>

<div id="sheet" class="hidden">
  <div id="sheet-head"><b id="sheet-title"></b><button onclick="closeSheet()">✕</button></div>
  <div id="sheet-players" class="sheet-body hidden"></div>
  <div id="sheet-chat" class="hidden">
    <div id="chat-msgs"></div>
    <div id="chat-form">
      <input type="text" id="chat-input" placeholder="Сообщение..." maxlength="300" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Отправить</button>
    </div>
  </div>
</div>

зовая горелка."},{"id":"baggage_13","text":"Спальный мешок."},{"id":"baggage_14","text":"Набор посуды и котелок."},{"id":"baggage_15","text":"Фонарик с ручной зарядкой."},{"id":"baggage_16","text":"Верёвка длиной 30 метров."},{"id":"baggage_17","text":"Набор для шитья и ремонта одежды."},{"id":"baggage_18","text":"Старый ноутбук с офлайн-библиотекой знаний."},{"id":"baggage_19","text":"Маленький генератор."},{"id":"baggage_20","text":"Запас батареек."},{"id":"baggage_21","text":"Топор и ручная пила."},{"id":"baggage_22","text":"Детектор радиации."},{"id":"baggage_23","text":"Набор семян лекарственных растений."},{"id":"baggage_24","text":"Комплект для ремонта обуви."},{"id":"baggage_25","text":"Полевой бинокль."},{"id":"baggage_26","text":"Карта местности и компас."},{"id":"baggage_27","text":"Ручной насос."},{"id":"baggage_28","text":"Небольшой запас консервов."},{"id":"baggage_29","text":"Набор для разведения огня."},{"id":"baggage_30","text":"Семейный фотоальбом, не имеющий практической ценности."}],"special_conditions":[{"id":"special_01","text":"Не может раскрыть свою профессию до второго голосования."},{"id":"special_02","text":"Имеет право один раз поменять свою карту здоровья."},{"id":"special_03","text":"Должен выбрать союзника и голосовать вместе с ним один раунд."},{"id":"special_04","text":"Не может голосовать в первом раунде."},{"id":"special_05","text":"Может задать одному игроку дополнительный вопрос."},{"id":"special_06","text":"Должен раскрыть одну карту по выбору группы."},{"id":"special_07","text":"Его голос считается за два в одном голосовании."},{"id":"special_08","text":"Необходимо убедить группу, что он полезен, не называя профессию."},{"id":"special_09","text":"Может один раз отменить своё выбывание, если большинство согласится."},{"id":"special_10","text":"Должен раскрыть свою фобию сразу."},{"id":"special_11","text":"Получает дополнительное место в бункере для выбранного игрока."},{"id":"special_12","text":"Не может раскрывать багаж до последнего раунда."},{"id":"special_13","text":"Может обменять одну свою карту с закрытой колодой."},{"id":"special_14","text":"Обязан первым рассказать о своих навыках."},{"id":"special_15","text":"Может один раз изменить голос после обсуждения."},{"id":"special_16","text":"Его карта факта раскрывается случайным образом."},{"id":"special_17","text":"Должен выбрать игрока, чью профессию будет защищать."},{"id":"special_18","text":"Не может раскрывать возраст до финального голосования."},{"id":"special_19","text":"Получает право на дополнительную минуту выступления."},{"id":"special_20","text":"Должен раскрыть две карты вместо одной при следующем раскрытии."},{"id":"special_21","text":"Может один раз попросить группу провести повторное голосование."},{"id":"special_22","text":"Его багаж считается общим ресурсом команды."},{"id":"special_23","text":"Не может голосовать против выбранного им союзника."},{"id":"special_24","text":"Может скрыть одну негативную характеристику до конца игры."},{"id":"special_25","text":"Должен рассказать правдивую историю из прошлого персонажа."},{"id":"special_26","text":"При равенстве голосов его голос решающий."},{"id":"special_27","text":"Может предложить обмен картами двум игрокам."},{"id":"special_28","text":"Должен раскрыть профессию, но может скрыть факт."},{"id":"special_29","text":"Получает право последним выступить перед голосованием."},{"id":"special_30","text":"Особых условий нет."}],"catastrophes":[{"id":"disaster_01","text":"Глобальная пандемия неизвестного вируса: большая часть населения заражена."},{"id":"disaster_02","text":"Падение крупного астероида вызвало масштабные разрушения и пожары."},{"id":"disaster_03","text":"Ядерная война сделала значительную часть поверхности опасной для жизни."},{"id":"disaster_04","text":"Серия супервулканических извержений закрыла небо пеплом на годы."},{"id":"disaster_05","text":"Глобальное потепление вызвало экстремальную жару и засуху."},{"id":"disaster_06","text":"Мощнейшее землетрясение разрушило большинство крупных городов."},{"id":"disaster_07","text":"Мировой океан поднялся и затопил прибрежные территории."},{"id":"disaster_08","text":"Неизвестный грибок уничтожает основные сельскохозяйственные культуры."},{"id":"disaster_09","text":"Солнечная буря вывела из строя большую часть электроники и энергосетей."},{"id":"disaster_10","text":"Крупная комета вызвала климатическую катастрофу."},{"id":"disaster_11","text":"Химическая авария распространила токсичное облако над несколькими странами."},{"id":"disaster_12","text":"Массовое вымирание пчёл привело к продовольственному кризису."},{"id":"disaster_13","text":"Глобальная война разрушила транспортную и энергетическую инфраструктуру."},{"id":"disaster_14","text":"Необычайно сильные морозы охватили большую часть планеты."},{"id":"disaster_15","text":"Непрерывные ливни вызвали всемирные наводнения."},{"id":"disaster_16","text":"Экспериментальная технология вышла из-под контроля и загрязнила атмосферу."},{"id":"disaster_17","text":"Опасные мутации микроорганизмов сделали многие источники воды непригодными."},{"id":"disaster_18","text":"Цепь мощных цунами уничтожила множество прибрежных поселений."},{"id":"disaster_19","text":"Длительная пыльная буря закрыла солнце и нарушила климат."},{"id":"disaster_20","text":"Неизвестное явление резко изменило состав атмосферы."}],"threats":[{"id":"threat_01","text":"Запасы продовольствия заражены неизвестным токсином."},{"id":"threat_02","text":"Вентиляционная система периодически пропускает опасный газ."},{"id":"threat_03","text":"Рядом с бункером замечена агрессивная группа выживших."},{"id":"threat_04","text":"Система фильтрации воды может выйти из строя через месяц."},{"id":"threat_05","text":"В бункере обнаружен источник неизвестной инфекции."},{"id":"threat_06","text":"Электроснабжение нестабильно, топлива осталось мало."},{"id":"threat_07","text":"Вход в бункер постепенно засыпает обломками."},{"id":"threat_08","text":"В районе бункера повышен уровень радиации."} let currentUser = null, currentRoomId = null, unsubscribeRoom = null;
let selectedGame = null, lastRoom = null, sheetMode = null, seenChat = 0, selCard = null, targetFor = null;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GAME_NAME = { crocodile: '🐊 Крокодил', bunker: '☢️ Бункер' };

// ---------- Авторизация / профиль ----------
window.loginWithGoogle = async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (e) { alert("Ошибка входа: " + e.message); }
};

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().name) {
      currentUser.displayNameCustom = snap.data().name;
      $('display-user-name').innerText = currentUser.displayNameCustom;
      showScreen('screen-select');
    } else showScreen('screen-profile');
  } else { currentUser = null; showScreen('screen-auth'); }
});

window.saveProfile = async () => {
  const name = $('profile-name').value.trim();
  if (!name) return alert("Введите имя!");
  await setDoc(doc(db, "users", currentUser.uid), { name, email: currentUser.email });
  currentUser.displayNameCustom = name;
  $('display-user-name').innerText = name;
  showScreen('screen-select');
};

window.selectGame = (g) => {
  selectedGame = g;
  $('menu-title').innerText = GAME_NAME[g];
  showScreen('screen-menu');
};

// ---------- Комнаты ----------
window.createRoomModal = async () => {
  let theme = '';
  if (selectedGame === 'crocodile') {
    theme = prompt("Введите общую тему для игры:");
    if (!theme) return;
  }
  const roomCode = Math.floor(1000 + Math.random() * 9000).toString();
  const roomId = "room_" + roomCode;
  const me = { id: currentUser.uid, name: currentUser.displayNameCustom };
  const roomData = {
    code: roomCode, game: selectedGame, theme, hostId: currentUser.uid, status: 'waiting',
    chat: [], currentTurnIndex: 0,
    players: [selectedGame === 'crocodile' ? { ...me, word: '', assignedWord: '', isGuessed: false } : { ...me }]
  };
  await setDoc(doc(db, "rooms", roomId), roomData);
  enterRoom(roomId);
};

window.joinRoom = async () => {
  const code = $('join-code').value.trim();
  if (!code) return alert("Введите код комнаты!");
  const snapQ = await getDocs(query(collection(db, "rooms"), where("code", "==", code)));
  if (snapQ.empty) return alert("Комната не найдена!");

  const roomDoc = snapQ.docs[0];
  const room = roomDoc.data();
  const game = room.game || 'crocodile';
  const already = room.players.some(p => p.id === currentUser.uid);

  if (!already) {
    if (room.status !== 'waiting') return alert("Игра уже началась!");
    if (room.players.length >= 10) return alert("Комната заполнена (макс. 10 игроков)!");
    const me = { id: currentUser.uid, name: currentUser.displayNameCustom };
    room.players.push(game === 'crocodile' ? { ...me, word: '', assignedWord: '', isGuessed: false } : me);
    await updateDoc(doc(db, "rooms", roomDoc.id), { players: room.players });
  }
  selectedGame = game;
  enterRoom(roomDoc.id);
};

function enterRoom(roomId) {
  currentRoomId = roomId; lastRoom = null; seenChat = 0; selCard = null; targetFor = null;
  showScreen('screen-room');
  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = onSnapshot(doc(db, "rooms", roomId), (snap) => {
    if (!snap.exists()) { alert("Комната была удалена"); leaveToMenu(); return; }
    lastRoom = snap.data();
    updateRoomUI(lastRoom);
  });
}

function updateRoomUI(room) {
  const game = room.game || 'crocodile';
  $('room-title').innerText = game === 'crocodile' ? `Крокодил (тема: ${room.theme})` : 'Бункер — ожидание игроков';
  $('room-code-display').innerText = room.code;
  $('players-list').innerHTML = room.players.map(p =>
    `<div class="player-item"><span>${esc(p.name)}</span>${p.id === room.hostId ? '<b>(Создатель)</b>' : ''}</div>`).join('');

  const startBtn = $('start-game-btn');
  startBtn.classList.toggle('hidden', !(room.hostId === currentUser.uid && room.status === 'waiting' && room.players.length >= 3));

  if (game === 'crocodile') {
    if (room.status === 'input' && $('screen-word-input').classList.contains('hidden') && $('screen-game').classList.contains('hidden')) {
      showScreen('screen-word-input'); $('input-theme').innerText = room.theme;
    } else if (room.status === 'playing') { showScreen('screen-game'); renderGame(room); }
  } else if (room.status === 'playing' || room.status === 'finished') {
    showScreen('screen-bunker'); renderBunker(room);
  }
  renderChatAndSheet(room);
}

window.startGame = async () => {
  const room = lastRoom;
  if ((room.game || 'crocodile') === 'crocodile') {
    await updateDoc(doc(db, "rooms", currentRoomId), { status: 'input' });
  } else {
    await updateDoc(doc(db, "rooms", currentRoomId), dealBunker(room));
  }
};

// ---------- Крокодил ----------
window.submitWord = async () => {
  const word = $('secret-word-input').value.trim();
  if (!word) return alert("Введите слово!");
  const roomRef = doc(db, "rooms", currentRoomId);
  const room = (await getDoc(roomRef)).data();
  room.players.find(p => p.id === currentUser.uid).word = word;

  if (room.players.every(p => p.word !== '')) {
    const words = room.players.map(p => p.word);
    let shuffled, valid = false;
    while (!valid) {
      shuffled = [...words].sort(() => Math.random() - 0.5);
      valid = room.players.every((p, i) => p.word !== shuffled[i]);
    }
    room.players.forEach((p, i) => p.assignedWord = shuffled[i]);
    room.status = 'playing';
  }
  await updateDoc(roomRef, { players: room.players, status: room.status });
};

function renderGame(room) {
  $('win-btn').classList.remove('hidden');
  const cur = room.players[room.currentTurnIndex % room.players.length];
  $('current-turn-name').innerText = cur.name;
  $('game-players-list').innerHTML = room.players.map(p => {
    const wordInfo = p.id === currentUser.uid ? "<i>(Ваше слово скрыто от вас)</i>" : `Слово: <b>${esc(p.assignedWord)}</b>`;
    return `<div class="player-item" style="background:${p.isGuessed ? '#e6ffe6' : 'white'}">
      <span>${esc(p.name)} ${p.isGuessed ? '✅ Угадал' : ''}</span><span>${wordInfo}</span></div>`;
  }).join('');
  $('turn-controls').classList.toggle('hidden', cur.id !== currentUser.uid);
}

window.handleGuessResult = async (guessed) => {
  const roomRef = doc(db, "rooms", currentRoomId);
  const room = (await getDoc(roomRef)).data();
  if (guessed) room.players[room.currentTurnIndex % room.players.length].isGuessed = true;
  else room.currentTurnIndex += 1;
  await updateDoc(roomRef, { players: room.players, currentTurnIndex: room.currentTurnIndex });
};

window.declareWin = async () => {
  alert("Поздравляем с победой! Комната удаляется, игра завершена.");
  if (currentRoomId) await deleteDoc(doc(db, "rooms", currentRoomId));
  leaveToMenu();
};

// ---------- Бункер: раздача ----------
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ruYears = n => { const m = n % 10, h = n % 100; return `${n} ${m === 1 && h !== 11 ? 'год' : (m >= 2 && m <= 4 && (h < 12 || h > 14)) ? 'года' : 'лет'}`; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

const CARD_TYPES = [
  ['bio', 'Пол и возраст'], ['profession', 'Профессия'], ['health', 'Здоровье'], ['hobby', 'Хобби'],
  ['phobia', 'Фобия'], ['baggage', 'Багаж'], ['fact', 'Факт']
];

function dealBunker(room) {
  const D = bunkerData, n = room.players.length;
  const decks = {
    bio: shuffle(D.biological_characteristics).map(b => `${b.sex}, ${ruYears(b.age)}`),
    profession: shuffle(D.professions).map(x => x.text), health: shuffle(D.health).map(x => x.text),
    hobby: shuffle(D.hobbies).map(x => x.text), phobia: shuffle(D.phobias).map(x => x.text),
    baggage: shuffle(D.baggage).map(x => x.text), fact: shuffle(D.facts).map(x => x.text)
  };
  const actions = shuffle(D.action_cards).map(x => x.text);
  const players = room.players.map((p, i) => ({
    id: p.id, name: p.name, eliminated: false, revealedRound: 0,
    cards: CARD_TYPES.map(([k, label]) => ({ key: k, label, text: decks[k][i], revealed: false })),
    actions: [actions[i * 2], actions[i * 2 + 1]].map(t => ({ text: t, used: false }))
  }));
  return {
    players, status: 'playing', phase: 'reveal', round: 1, votes: {}, ties: 0, effects: [], lastEvent: '',
    seats: Math.max(1, Math.floor(n / 2)),
    catastrophe: pick(D.catastrophes).text, bunkerDesc: pick(D.bunker_descriptions).text
  };
}

// ---------- Бункер: логика (в транзакциях) ----------
async function mutate(fn) {
  const ref = doc(db, "rooms", currentRoomId);
  await runTransaction(db, async (tx) => {
    const room = (await tx.get(ref)).data();
    if (fn(room) === false) return;
    tx.update(ref, room);
  });
}
const alive = room => room.players.filter(p => !p.eliminated);
const turnPlayer = room => alive(room).find(p => p.revealedRound !== room.round);

window.selectCard = (i) => { selCard = selCard === i ? null : i; renderBunker(lastRoom); };

window.revealCard = () => {
  const i = selCard; if (i === null) return;
  selCard = null;
  mutate(room => {
    const t = turnPlayer(room);
    if (room.phase !== 'reveal' || !t || t.id !== currentUser.uid) return false;
    const me = room.players.find(p => p.id === currentUser.uid);
    if (me.cards[i].revealed) return false;
    me.cards[i].revealed = true; me.revealedRound = room.round;
    room.lastEvent = `${me.name} открыл(а): ${me.cards[i].label} — ${me.cards[i].text}`;
    if (!turnPlayer(room)) { room.phase = 'vote'; room.votes = {}; room.ties = 0; }
  });
};

window.castVote = (targetId) => {
  mutate(room => {
    const me = room.players.find(p => p.id === currentUser.uid);
    if (room.phase !== 'vote' || me.eliminated || room.votes[me.id]) return false;
    room.votes[me.id] = targetId;
    const a = alive(room);
    if (Object.keys(room.votes).length < a.length) return;

    const tally = {};
    Object.values(room.votes).forEach(t => tally[t] = (tally[t] || 0) + 1);
    const max = Math.max(...Object.values(tally));
    let top = Object.keys(tally).filter(k => tally[k] === max);

    if (top.length > 1 && room.ties < 2) {
      room.ties += 1; room.votes = {};
      room.lastEvent = `Голоса разделились — никого не выгнали. Повторное голосование (${room.ties}).`;
      return;
    }
    const outId = pick(top);
    const out = room.players.find(p => p.id === outId);
    out.eliminated = true; out.cards.forEach(c => c.revealed = true);
    room.lastEvent = `${out.name} выгнан(а) из бункера.` + (top.length > 1 ? ' (жребий среди равных)' : '');
    room.votes = {}; room.ties = 0;
    if (alive(room).length <= room.seats) { room.status = 'finished'; return; }
    room.round += 1; room.phase = 'reveal';
  });
};

window.pickTarget = (actIdx) => { targetFor = targetFor === actIdx ? null : actIdx; renderBunker(lastRoom); };
window.useAction = (actIdx, target) => {
  targetFor = null;
  mutate(room => {
    const me = room.players.find(p => p.id === currentUser.uid);
    const a = me.actions[actIdx];
    if (a.used || me.eliminated) return false;
    a.used = true;
    room.effects = room.effects || [];
    room.effects.push({ by: me.name, text: a.text, target, round: room.round });
    const tName = target === 'bunker' ? 'бункер' : room.players.find(p => p.id === target).name;
    room.lastEvent = `${me.name} применил(а) карту на: ${tName}`;
  });
};

// ---------- Бункер: отрисовка ----------
const effectsHtml = (room, target) => (room.effects || []).filter(e => e.target === target)
  .map(e => `<div class="tag bad">⚡ ${esc(e.text)} <i>(${esc(e.by)}, р.${e.round})</i></div>`).join('');

function renderBunker(room) {
  const me = room.players.find(p => p.id === currentUser.uid);
  const isHost = room.hostId === currentUser.uid;
  $('b-round').innerText = room.round;
  $('b-world').innerHTML = `
    <h4>🌍 Катастрофа</h4><div>${esc(room.catastrophe)}</div>
    <h4 style="margin-top:10px">🏚 Бункер (мест: ${room.seats}, осталось игроков: ${alive(room).length})</h4><div>${esc(room.bunkerDesc)}</div>
    ${effectsHtml(room, 'bunker') ? `<div style="margin-top:6px"><b>Действуют на бункер:</b><br>${effectsHtml(room, 'bunker')}</div>` : ''}`;

  const t = turnPlayer(room);
  let status = room.status === 'finished' ? '🏁 Игра окончена' :
    room.phase === 'reveal' ? (t ? (t.id === me.id ? '👉 Ваш ход: нажмите на свою карту и откройте её всем' : `Открывает карту: ${esc(t.name)}`) : '') :
    `🗳 Голосование${room.ties ? ` (повторное, №${room.ties}+1)` : ''}: ${Object.keys(room.votes || {}).length}/${alive(room).length} проголосовали`;
  $('b-status').innerHTML = status + (room.lastEvent ? `<div style="font-weight:normal;margin-top:6px;font-size:14px">${esc(room.lastEvent)}</div>` : '');

  // Голосование
  const voteEl = $('b-vote');
  const voting = room.status === 'playing' && room.phase === 'vote' && !me.eliminated;
  voteEl.classList.toggle('hidden', !voting);
  if (voting) {
    const my = (room.votes || {})[me.id];
    voteEl.innerHTML = my ? `<div class="box">Вы проголосовали против: <b>${esc(room.players.find(p => p.id === my).name)}</b>. Ждём остальных…</div>` :
      `<div class="box"><h4>Кого выгнать?</h4>${alive(room).filter(p => p.id !== me.id).map(p =>
        `<button class="red" onclick="castVote('${p.id}')">${esc(p.name)}</button>`).join('')}</div>`;
  }

  // Мои карты
  const canReveal = room.status === 'playing' && room.phase === 'reveal' && t && t.id === me.id;
  let html = `<div class="box"><h4>Ваш персонаж${me.eliminated ? ' (вы выгнаны)' : ''}</h4><div class="cards">` +
    me.cards.map((c, i) => `<div class="bcard ${c.revealed ? 'open' : ''} ${selCard === i ? 'sel' : ''}"
      ${!c.revealed && canReveal ? `onclick="selectCard(${i})"` : ''}>
      <small>${c.label}${c.revealed ? ' · открыто' : ''}</small>${esc(c.text)}</div>`).join('') + `</div>`;
  if (canReveal && selCard !== null) html += `<button class="green" onclick="revealCard()">👁 Показать всем: ${me.cards[selCard].label}</button>`;
  html += effectsHtml(room, me.id) ? `<div style="margin-top:8px"><b>Действуют на вас:</b><br>${effectsHtml(room, me.id)}</div>` : '';
  html += `</div>`;

  // Карты действия
  if (room.status === 'playing' && !me.eliminated) {
    html += `<div class="box"><h4>Ваши карты действия</h4>` + me.actions.map((a, i) => `
      <div style="margin:8px 0;${a.used ? 'opacity:.5' : ''}">
        <div>${esc(a.text)} ${a.used ? '<b>(использована)</b>' : ''}</div>
        ${a.used ? '' : `<button class="small gray" onclick="pickTarget(${i})">Применить…</button>`}
        ${targetFor === i ? `<div>На кого?<br>
          <button class="small red" onclick="useAction(${i},'bunker')">☢️ Бункер</button>
          ${room.players.filter(p => !p.eliminated).map(p => `<button class="small" onclick="useAction(${i},'${p.id}')">${esc(p.name)}${p.id === me.id ? ' (я)' : ''}</button>`).join('')}</div>` : ''}
      </div>`).join('') + `</div>`;
  }
  $('b-me').innerHTML = html;

  // Финал
  const end = $('b-end');
  end.classList.toggle('hidden', room.status !== 'finished');
  if (room.status === 'finished') {
    end.innerHTML = `<div class="box"><h4>🎉 Выжили в бункере:</h4>${alive(room).map(p => `<div>✅ ${esc(p.name)}</div>`).join('')}
      ${isHost ? `<button class="red" onclick="closeRoom()">Удалить комнату</button>` : ''}
      <button class="gray" onclick="leaveToMenu()">Выйти в меню</button></div>`;
  }
}

window.closeRoom = async () => { if (currentRoomId) await deleteDoc(doc(db, "rooms", currentRoomId)); leaveToMenu(); };

// ---------- Окно «Игроки» ----------
function playersSheetHtml(room) {
  if ((room.game || 'crocodile') === 'crocodile') {
    if (room.status !== 'playing') return room.players.map(p => `<div class="player-item">${esc(p.name)}</div>`).join('');
    return room.players.map(p => `<div class="player-item" style="background:${p.isGuessed ? '#e6ffe6' : 'white'}">
      <span>${esc(p.name)} ${p.isGuessed ? '✅ Угадал' : ''}</span>
      <span>${p.id === currentUser.uid ? '<i>(скрыто от вас)</i>' : 'Слово: <b>' + esc(p.assignedWord) + '</b>'}</span></div>`).join('');
  }
  if (room.status === 'waiting') return room.players.map(p => `<div class="player-item">${esc(p.name)}</div>`).join('');
  return room.players.map(p => {
    const open = p.cards.filter(c => c.revealed);
    return `<div class="box ${p.eliminated ? 'dead' : ''}"><h4 class="name">${esc(p.name)} ${p.eliminated ? '❌ выгнан(а)' : ''}</h4>
      ${open.length ? open.map(c => `<div class="tag" style="background:#e6f4ea;border-color:#9ad3a8"><b>${c.label}:</b> ${esc(c.text)}</div>`).join('') : '<i>пока ничего не открыто</i>'}
      <div style="font-size:12px;color:#888;margin-top:6px">Закрыто карт: ${p.cards.length - open.length}</div>
      ${effectsHtml(room, p.id) ? `<div style="margin-top:6px"><b>Карты действия на игроке:</b><br>${effectsHtml(room, p.id)}</div>` : ''}</div>`;
  }).join('');
}

// ---------- Чат и панели ----------
window.openSheet = (mode) => {
  sheetMode = mode;
  $('sheet').classList.remove('hidden');
  $('sheet-title').innerText = mode === 'chat' ? '💬 Чат' : '👥 Игроки';
  $('sheet-players').classList.toggle('hidden', mode !== 'players');
  $('sheet-chat').classList.toggle('hidden', mode !== 'chat');
  if (lastRoom) renderChatAndSheet(lastRoom);
  if (mode === 'chat') $('chat-input').focus();
};
window.closeSheet = () => { sheetMode = null; $('sheet').classList.add('hidden'); if (lastRoom) renderChatAndSheet(lastRoom); };

function renderChatAndSheet(room) {
  const chat = room.chat || [];
  if (sheetMode === 'chat') {
    seenChat = chat.length;
    const box = $('chat-msgs');
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    box.innerHTML = chat.slice(-100).map(m => `<div class="msg ${m.uid === currentUser.uid ? 'me' : ''}"><b>${esc(m.name)}</b><i>${new Date(m.ts).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'})}</i><br>${esc(m.text)}</div>`).join('') || '<i style="color:#999">Сообщений пока нет</i>';
    if (atBottom) box.scrollTop = box.scrollHeight;
  }
  const unread = chat.length - seenChat;
  $('chat-badge').innerText = unread;
  $('chat-badge').classList.toggle('hidden', unread <= 0 || sheetMode === 'chat');
  if (sheetMode === 'players') $('sheet-players').innerHTML = playersSheetHtml(room);
}

window.sendChat = async () => {
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text || !currentRoomId) return;
  input.value = '';
  await updateDoc(doc(db, "rooms", currentRoomId), {
    chat: arrayUnion({ uid: currentUser.uid, name: currentUser.displayNameCustom, text, ts: Date.now() })
  });
};

// ---------- Навигация ----------
function leaveToMenu() {
  if (unsubscribeRoom) unsubscribeRoom();
  unsubscribeRoom = null; currentRoomId = null; lastRoom = null;
  closeSheet();
  showScreen('screen-menu');
}
window.leaveToMenu = leaveToMenu;

function showScreen(id) {
  ['screen-auth','screen-profile','screen-select','screen-menu','screen-room','screen-word-input','screen-game','screen-bunker']
    .forEach(s => $(s).classList.add('hidden'));
  $(id).classList.remove('hidden');
  const inRoom = ['screen-room','screen-word-input','screen-game','screen-bunker'].includes(id);
  $('bar').classList.toggle('hidden', !inRoom);
  if (!inRoom) closeSheet();
  if (id !== 'screen-game') $('win-btn').classList.add('hidden');
}
window.showScreen = showScreen;
</script>
</body>
</html>
